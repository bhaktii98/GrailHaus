<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrailHaus — The Collector's Vault</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e8ebef;
    --dim: rgba(232,235,239,0.42);
    --ti: oklch(0.80 0.018 90);
    --icon: oklch(0.78 0.055 82);
    --hair: rgba(232,235,239,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #08090b; overflow: hidden; }
  body { font-family: "Archivo", system-ui, sans-serif; color: var(--ink); }
  a, a:hover { color: var(--ti); text-decoration: none; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { position: fixed; inset: 0; height: 100%; }

  #vig {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(58% 52% at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.72) 100%);
    opacity: 0.55; transition: opacity 1.4s cubic-bezier(.4,0,.2,1);
  }
  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .ui button { pointer-events: auto; }

  .mark { position: absolute; top: 26px; left: 28px; }
  .mark .wm {
    font-size: 15px; font-weight: 500; letter-spacing: 0.42em; text-transform: uppercase;
  }
  .meta {
    margin-top: 9px; font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; white-space: nowrap;
  }
  .rule { width: 34px; height: 1px; background: var(--hair); margin: 12px 0; }
  #tier {
    margin-top: 16px; opacity: 0; transition: opacity 1.2s;
    font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.2em;
    color: var(--dim); text-transform: uppercase; white-space: nowrap;
  }
  #tier span { color: var(--icon); }

  #phase {
    position: absolute; top: 28px; right: 28px; text-align: right;
    font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.22em;
    color: var(--dim); text-transform: uppercase; transition: opacity .5s;
  }
  #phase b { display: block; white-space: nowrap; color: var(--ink); font-weight: 400; margin-top: 7px; letter-spacing: 0.26em; }

  #hint {
    position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%);
    text-align: center; transition: opacity .7s;
  }
  #hint .k {
    font-size: 10.5px; letter-spacing: 0.34em; text-transform: uppercase; color: rgba(232,235,239,0.72);
  }
  #hint .arrow {
    width: 1px; height: 30px; margin: 14px auto 0;
    background: linear-gradient(to top, rgba(232,235,239,0), rgba(232,235,239,0.55));
    animation: pull 2.6s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes pull { 0%,100% { transform: translateY(6px); opacity: .35 } 50% { transform: translateY(-4px); opacity: 1 } }

  #sweep {
    position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0;
    background: linear-gradient(100deg, transparent 44%, rgba(255,255,255,0.10) 49.5%, rgba(255,255,255,0.34) 50%, rgba(255,255,255,0.10) 50.5%, transparent 56%);
    transform: translateX(-60%);
  }
  #sweep.go { animation: trace 2.1s cubic-bezier(.32,0,.24,1) forwards; }
  @keyframes trace {
    0% { opacity: 0; transform: translateX(-58%) }
    18% { opacity: .9 }
    82% { opacity: .9 }
    100% { opacity: 0; transform: translateX(58%) }
  }

  #rarity {
    position: absolute; left: 7%; top: 50%; transform: translate(0,-50%) scale(.985);
    text-align: left; opacity: 0; transition: opacity 1.5s cubic-bezier(.4,0,.2,1), transform 1.8s cubic-bezier(.4,0,.2,1);
  }
  #rarity.show { opacity: 1; transform: translate(0,-50%) scale(1); }
  #rarity .lbl {
    font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.34em;
    color: var(--dim); text-transform: uppercase;
  }
  #rarity .word {
    margin: 16px 0 14px; font-size: clamp(46px, 9vw, 108px); font-weight: 300;
    letter-spacing: 0.16em; line-height: 1; color: var(--icon);
    text-shadow: 0 0 62px rgba(214,178,116,0.28);
  }
  #rarity .hr { width: 132px; height: 1px; background: var(--hair); margin: 0 0 14px; }
  #rarity .ed { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.26em; color: rgba(232,235,239,0.6); }

  #inspect {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .9s;
  }
  #inspect.show { opacity: 1; }
  #inspect button {
    appearance: none; background: rgba(255,255,255,0.03); color: rgba(232,235,239,0.68);
    border: 1px solid var(--hair); border-radius: 1px; padding: 10px 13px;
    font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.18em;
    text-transform: uppercase; cursor: pointer;
    transition: background .3s, color .3s, border-color .3s;
  }
  #inspect button:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(232,235,239,0.3); }
  #inspect button.on { color: #0a0b0d; background: var(--ti); border-color: var(--ti); }
  #inspect .sep { width: 1px; background: var(--hair); margin: 4px 6px; }

  #arch {
    position: absolute; left: 28px; bottom: 40px;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  #arch .ttl {
    font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 0.28em;
    color: var(--dim); text-transform: uppercase;
  }
  #arch .btns { display: flex; flex-direction: column; gap: 4px; }
  #arch button {
    appearance: none; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.02); color: rgba(232,235,239,0.6);
    border: 1px solid var(--hair); border-radius: 1px; padding: 8px 12px 8px 10px;
    font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.16em;
    text-transform: uppercase; cursor: pointer; text-align: left; min-width: 178px;
    transition: background .3s, color .3s, border-color .3s;
  }
  #arch button:hover { background: rgba(255,255,255,0.07); color: #fff; border-color: rgba(232,235,239,0.28); }
  #arch button.on { color: #fff; background: rgba(255,255,255,0.09); border-color: rgba(232,235,239,0.34); }
  #arch .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
  #arch .nm { flex: 1; }
  #arch .rm { color: var(--dim); letter-spacing: 0.1em; }

  @media (max-width: 640px) {
    .mark { top: 20px; left: 20px; }
    .mark .wm { font-size: 12.5px; letter-spacing: 0.34em; }
    #phase { top: 22px; right: 20px; font-size: 8.5px; }
    #inspect { bottom: 66px; max-width: 92vw; }
    #rarity { left: 7%; top: 34%; }
    #rarity .word { font-size: clamp(38px, 13vw, 64px); }
    #inspect .sep { display: none; }
    #arch { left: 20px; bottom: 112px; }
    #arch button { min-width: 0; padding: 7px 9px; font-size: 8.5px; letter-spacing: 0.1em; }
    #arch .rm { display: none; }
  }
</style>
</head>
<body>
  <three-d-stage name="grailhaus-icon-vault" background="#08090b"></three-d-stage>
  <div id="vig"></div>
  <div id="sweep"></div>

  <div class="ui">
    <div class="mark">
      <div class="wm">GrailHaus</div>
      <div class="rule"></div>
      <div class="meta">The Collector's Vault<br>Reference <span id="ref">GH·V07</span> — Icon Tier</div>
      <div id="tier">Rarity <span>Icon</span> · Edition <span id="ed">04 / 12</span></div>
    </div>

    <div id="phase">Sequence<b>01 · Vault Closed</b></div>

    <div id="hint">
      <div class="k">Drag up to unseal</div>
      <div class="arrow"></div>
    </div>

    <div id="rarity">
      <div class="lbl">Rarity Confirmed</div>
      <div class="word">ICON</div>
      <div class="hr"></div>
      <div class="ed"><span id="rname">Monolith</span> · Edition <span id="red">04 / 12</span> · Certified GrailHaus</div>
    </div>

    <div id="arch">
      <div class="ttl">Archetype</div>
      <div class="btns"></div>
    </div>

    <div id="inspect">
      <button data-view="hero" class="on">Hero</button>
      <button data-view="dial">Dial</button>
      <button data-view="case">Case</button>
      <button data-view="crown">Crown</button>
      <button data-view="bracelet">Bracelet</button>
      <button data-view="movement">Movement</button>
      <div class="sep"></div>
      <button data-view="reseal">Reseal Vault</button>
    </div>
  </div>

  <script src="./three-d-stage.js"></script>
  <script type="module" src="./vault.js"></script>
</body>
</html>
