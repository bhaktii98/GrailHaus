<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrailHaus — The Heritage Case</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #efe6d8; --dim: rgba(239,230,216,.5); --brass: #c39b57; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #100d0b; color: var(--ink); }
  body { font-family: "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; }
  a { color: var(--brass); } a:hover { color: #e0bd7e; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(70% 60% at 50% 44%, transparent 30%, rgba(8,6,5,.72) 100%); }
  .ui { position: absolute; inset: 0; pointer-events: none; }
  .masthead { position: absolute; top: 28px; left: 32px; }
  .masthead .mark { font-family: "IBM Plex Mono", monospace; font-size: 11px;
    letter-spacing: .34em; text-transform: uppercase; color: var(--brass); }
  .masthead h1 { font-family: "Cormorant Garamond", serif; font-weight: 300;
    font-size: 34px; letter-spacing: .02em; margin: 10px 0 0; }
  .masthead p { margin: 6px 0 0; font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); }
  .states { position: absolute; left: 32px; bottom: 32px; display: grid; gap: 9px; pointer-events: auto; }
  .state { display: flex; align-items: center; gap: 12px; font-size: 11px;
    letter-spacing: .16em; text-transform: uppercase; color: rgba(239,230,216,.32);
    transition: color .6s ease; cursor: pointer; }
  .state:hover { color: rgba(239,230,216,.75); }
  .state i { width: 18px; height: 1px; background: rgba(239,230,216,.22); display: block;
    transition: background .6s ease, width .6s ease; }
  .state.on { color: var(--ink); }
  .state.on i { background: var(--brass); width: 34px; }
  .state.done { color: rgba(239,230,216,.5); }
  .hint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    text-align: center; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dim); transition: opacity .8s ease; }
  .hint em { display: block; font-family: "Cormorant Garamond", serif; font-style: normal;
    font-size: 20px; letter-spacing: .04em; color: var(--ink); text-transform: none; margin-bottom: 8px; }
  .actions { position: absolute; right: 32px; bottom: 84px; pointer-events: auto;
    display: flex; gap: 10px; opacity: 0; transition: opacity .7s ease; }
  .actions.on { opacity: 1; }
  button.ghost { pointer-events: auto; appearance: none; cursor: pointer;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--ink); background: rgba(239,230,216,.05);
    border: 1px solid rgba(239,230,216,.22); border-radius: 2px; padding: 10px 16px; }
  button.ghost:hover { background: rgba(239,230,216,.12); border-color: var(--brass); }
  .fade { opacity: 0; }

  /* the collection — any Heritage row drops into this same case */
  .collection { position: absolute; top: 28px; right: 32px; width: 236px;
    max-height: 46vh; overflow-y: auto; pointer-events: auto;
    display: grid; gap: 1px; scrollbar-width: thin; }
  .collection button.row { display: grid; grid-template-columns: 34px 1fr;
    grid-template-areas: "ref nm" ". ed"; column-gap: 10px; text-align: left;
    appearance: none; cursor: pointer; background: transparent; border: 0;
    border-top: 1px solid rgba(239,230,216,.08); padding: 9px 2px 9px 0;
    font-family: "IBM Plex Mono", monospace; color: rgba(239,230,216,.42);
    transition: color .4s ease, border-color .4s ease; }
  .collection button.row:hover { color: rgba(239,230,216,.8); }
  .collection button.row.on { color: var(--ink); border-top-color: var(--brass); }
  .collection .ref { grid-area: ref; font-size: 9px; letter-spacing: .1em; padding-top: 3px;
    color: var(--brass); opacity: .7; }
  .collection button.row.on .ref { opacity: 1; }
  .collection .nm { grid-area: nm; font-family: "Cormorant Garamond", serif; font-size: 16px;
    letter-spacing: .01em; }
  .collection .ed { grid-area: ed; font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; opacity: .62; margin-top: 2px; }

  .ident { position: absolute; right: 32px; bottom: 132px; max-width: 260px; text-align: right;
    font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--dim); }
  .ident em { display: block; font-family: "Cormorant Garamond", serif; font-style: normal;
    font-size: 19px; letter-spacing: .02em; text-transform: none; color: var(--ink); margin-bottom: 7px; }

  /* Heritage moment: the word, a hairline, nothing else */
  .moment { position: absolute; inset: 0; display: grid; place-content: end center;
    padding-bottom: 13vh;
    pointer-events: none; opacity: 0; transition: opacity 1.1s ease; }
  .moment::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 50% 46%, transparent 12%, rgba(6,5,4,.72) 100%); }
  .moment.on { opacity: 1; }
  .moment .word { position: relative; font-size: 12px; letter-spacing: .62em;
    text-transform: uppercase; color: var(--ink); padding-bottom: 14px;
    transform: translateY(6px); transition: transform 1.4s ease; }
  .moment.on .word { transform: none; }
  .moment .word::after { content: ""; position: absolute; left: 0; right: .62em; bottom: 0;
    height: 1px; background: var(--brass); opacity: .8; }

  @media (max-width: 640px) {
    .masthead { top: 20px; left: 20px; } .masthead h1 { font-size: 26px; }
    .states { left: 20px; bottom: 22px; gap: 7px; } .state { font-size: 10px; }
    .actions { right: 20px; bottom: 78px; } .hint { bottom: 96px; }
    .collection { top: auto; bottom: 130px; right: 16px; width: 168px; max-height: 34vh; }
    .collection .nm { font-size: 14px; }
    .ident { display: none; }
  }
</style>
</head>
<body>
<three-d-stage name="grailhaus-heritage-case" background="#100d0b"></three-d-stage>
<div class="vignette"></div>
<div class="ui">
  <div class="masthead">
    <div class="mark">GrailHaus</div>
    <h1>The Heritage Case</h1>
    <p>Tier — Heritage · Ref. HC-01</p>
  </div>
  <div class="states" id="states">
    <div class="state" data-i="0"><i></i>Closed</div>
    <div class="state" data-i="1"><i></i>Lid opening</div>
    <div class="state" data-i="2"><i></i>Lid fully open</div>
    <div class="state" data-i="3"><i></i>Watch emergence</div>
    <div class="state" data-i="4"><i></i>Inspection</div>
  </div>
  <div class="hint" id="hint"><em>Drag upward to lift the lid</em>Slow and steady</div>
  <div class="collection" id="collection"></div>
  <div class="ident" id="ident"></div>
  <div class="actions" id="actions">
    <button class="ghost" id="reset">Return to rest</button>
  </div>
  <div class="moment" id="moment"><div class="word">Heritage</div></div>
</div>
<script src="./three-d-stage.js"></script>
<script type="module" src="./heritage-case.js"></script>
</body>
</html>
