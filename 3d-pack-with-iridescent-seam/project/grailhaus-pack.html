<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrailHaus — rip it open</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#060608;-webkit-user-select:none;user-select:none}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh;touch-action:none;background:transparent}
  #vign{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(58% 44% at 50% 40%, rgba(120,70,190,.20), rgba(6,5,10,0) 62%),
               radial-gradient(120% 90% at 50% 118%, rgba(216,169,63,.10), rgba(6,5,10,0) 60%)}
  #frame{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:24px 24px 32px;pointer-events:none;font-family:"Cormorant Garamond",Georgia,serif;color:#f0e8d8}
  .kicker{font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.32em;color:#a98a4e;text-transform:uppercase}
  h1{margin:8px 0 0;font-size:30px;font-weight:500;letter-spacing:.01em}
  h1 em{font-style:italic;color:#d8a93f}
  .meta{display:flex;gap:18px;margin-top:10px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#9a8bb5;letter-spacing:.08em}
  .pill{position:fixed;padding:11px 20px;border:1px solid rgba(216,169,63,.45);border-radius:999px;
    background:rgba(24,12,44,.78);color:#f6eeda;font:500 10px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)}
  #mode{right:24px;top:24px}
  #again{left:50%;transform:translateX(-50%);bottom:36px;opacity:0;pointer-events:none;transition:opacity .4s}
  #again[data-on]{opacity:1;pointer-events:auto}
  a{color:#d8a93f}a:hover{color:#ffe9ac}
</style>
</head>
<body>
<three-d-stage name="grailhaus-pack" background="transparent"></three-d-stage>
<div id="vign"></div>
<div id="frame">
  <div>
    <div class="kicker">Sealed · Series I</div>
    <h1>GrailHaus <em>Booster</em></h1>
    <div class="meta"><span>5 CARDS</span><span>1 GUARANTEED FOIL</span></div>
  </div>
  <div></div>
  <div></div>
</div>
<button class="pill" id="mode">Inspect</button>
<button class="pill" id="again">Reseal</button>
<script src="./three-d-stage.js"></script>
<script type="module">
  import * as THREE from 'three';
  import { buildPack } from './rip-pack.js';

  if (document.fonts) { try { await document.fonts.ready; } catch (e) {} }

  const stage = document.querySelector('three-d-stage');
  await stage.ready;

  const logo = await new Promise((res) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = './uploads/grailhaus logo.png';
  });

  const pack = buildPack(logo);
  stage.setObject(pack.group);

  // Jeweller's-box light: one warm key, a violet rim, no flat ambient wash.
  const scene = stage._scene;
  scene.children.filter((o) => o.isLight).forEach((l) => scene.remove(l));
  const key = new THREE.DirectionalLight(0xfff0d8, 3.0);
  key.position.set(0.16, 0.30, 0.28);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.bias = -0.0004;
  Object.assign(key.shadow.camera, { left: -0.12, right: 0.12, top: 0.12, bottom: -0.12 });
  key.shadow.camera.updateProjectionMatrix();
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8f5cff, 1.6);
  rim.position.set(-0.28, 0.10, -0.24);
  scene.add(rim);
  scene.add(new THREE.HemisphereLight(0x2a1b47, 0x090610, 0.7));
  if (stage._ground) stage._ground.material.opacity = 0.5;

  const controls = stage._controls;
  const camera = stage._camera;
  const CENTER_Y = 0.0;
  const reframe = () => {
    camera.position.set(0, CENTER_Y + 0.006, 0.205);
    controls.target.set(0, CENTER_Y, 0);
    controls.update();
  };
  reframe();

  let inspect = false;
  const setMode = (on) => {
    inspect = on;
    controls.enableRotate = on;
    controls.enableZoom = on;
    controls.enablePan = on;
    modeBtn.textContent = on ? 'Tear' : 'Inspect';
    if (stage._note) stage._note.textContent = on ? 'Drag to orbit · scroll to zoom' : '';
    if (!on) reframe();
  };
  const modeBtn = document.getElementById('mode');
  modeBtn.addEventListener('click', () => setMode(!inspect));
  setMode(false);

  // --- tear physics: 1:1 drag along the seam, with a flick release --------
  const travel = () => Math.min(280, innerWidth * 0.6);
  let progress = 0, base = 0, dragging = false, vel = 0, energy = 0;
  const again = document.getElementById('again');
  const buzz = (ms) => navigator.vibrate && navigator.vibrate(ms);
  let ticks = 0;

  // Screen-space extent of the pack's cut line, so the rip front sits exactly
  // under the thumb instead of tracking an arbitrary pixel distance.
  const cutSpan = () => {
    const p = new THREE.Vector3();
    const px = (x) => {
      p.set(x, pack.seamY, 0).applyMatrix4(pack.group.matrixWorld).project(camera);
      return (p.x * 0.5 + 0.5) * stage.clientWidth;
    };
    pack.group.updateMatrixWorld();
    const L = px(-pack.size.W / 2), R = px(pack.size.W / 2);
    return { L, span: Math.max(40, R - L) };
  };
  const cutAt = (clientX) => {
    const rect = stage.getBoundingClientRect();
    const { L, span } = cutSpan();
    return Math.min(1, Math.max(0, (clientX - rect.left - L) / span));
  };

  // progress-per-pixel of the seam, so gesture velocity converts to rip velocity
  const cutRate = () => 1 / Math.max(40, cutSpan().span);
  const spring = { live: false, target: 0, v: 0 };

  let pid = null, x0 = 0, lastX = 0, lastT = 0, grabStart = 0;
  // Vertical hit test: the rip can only be started on the tear strip at the
  // top of the pack, not anywhere over the card panel below it.
  const onTearStrip = (clientY) => {
    const rect = stage.getBoundingClientRect();
    const p = new THREE.Vector3();
    const py = (y) => {
      p.set(0, y, 0).applyMatrix4(pack.group.matrixWorld).project(camera);
      return (1 - (p.y * 0.5 + 0.5)) * stage.clientHeight;
    };
    pack.group.updateMatrixWorld();
    const top = py(pack.size.H / 2), seam = py(pack.seamY);
    const pad = Math.max(14, (seam - top) * 0.5);
    const y = clientY - rect.top;
    return y >= top - pad && y <= seam + pad;
  };

  stage.addEventListener('pointerdown', (e) => {
    if (inspect || progress >= 1) return;
    if (!onTearStrip(e.clientY)) return;
    pid = e.pointerId; x0 = lastX = e.clientX; lastT = e.timeStamp;
    base = progress; dragging = true; vel = 0;
    spring.live = false; spring.v = 0;        // a new touch takes over instantly
    grabStart = cutAt(e.clientX);
    stage.setPointerCapture(pid);
  });
  stage.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = (e.clientX - lastX) / dt;
    lastX = e.clientX; lastT = e.timeStamp;
    // cut follows the thumb: whatever point of the seam it is over, rips
    progress = Math.min(1, Math.max(0, cutAt(e.clientX) - grabStart));
    energy = Math.min(1, energy + Math.abs(vel) * 0.06);
    const t = Math.floor(progress * 14);
    if (t !== ticks) { ticks = t; buzz(5); }
  });
  const up = (e) => {
    if (e.pointerId !== pid) return;
    pid = null; dragging = false;
    const flick = e.timeStamp - lastT > 90 ? 0 : vel;
    // carry the gesture's own velocity into the settle; nothing snaps
    spring.v = flick * cutRate() * 1000;
    const reach = Math.max(0.12, 1 - grabStart);
    spring.target = (progress > 0.88 * reach || flick > 0.9) ? 1 : 0;
    spring.live = true;
    if (spring.target === 1) buzz(34);
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  again.addEventListener('click', () => {
    spring.live = false; spring.v = 0; spring.target = 0;
    progress = 0; shown = 0; again.removeAttribute('data-on');
  });

  Object.assign(window, { __pack: pack, __set: (p) => { progress = p; shown = p; } });

  // The stage's own observer/loop can land inert (1×1 canvas, no frames) when
  // the element is measured before layout — so this page owns fit + draw.
  const renderer = stage._renderer;

  renderer.setAnimationLoop(null);
  // A hidden iframe defers layout and fires neither rAF nor ResizeObserver, so
  // the first sized draw is forced here with a bounded setTimeout retry.
  const paint = () => {
    const r = stage.getBoundingClientRect();
    const w = Math.round(r.width) || innerWidth || 924;
    const h2 = Math.round(r.height) || innerHeight || 540;
    const cur = renderer.getSize(new THREE.Vector2());
    if (Math.abs(cur.x - w) > 0.5 || Math.abs(cur.y - h2) > 0.5) {
      renderer.setSize(w, h2, true);
      camera.aspect = w / h2;
      camera.updateProjectionMatrix();
    }
    renderer.render(scene, camera);
    return Math.abs(cur.x - w) < 0.5 && Math.abs(cur.y - h2) < 0.5;
  };
  [0, 50, 150, 400, 900].forEach((t) => setTimeout(paint, t));
  paint();
  addEventListener('resize', paint);
  document.addEventListener('visibilitychange', paint);
  new ResizeObserver(paint).observe(stage);
  if (document.fonts) document.fonts.ready.then(paint);

  let shown = 0, prev = performance.now();
  (function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    if (dragging) {
      shown = progress;                      // 1:1 with the finger
    } else if (spring.live) {
      const k = 46, c = 2 * Math.sqrt(k) * 0.62;   // underdamped, foil-light
      spring.v += ((spring.target - shown) * k - spring.v * c) * dt;
      shown += spring.v * dt;
      if (Math.abs(spring.target - shown) < 0.002 && Math.abs(spring.v) < 0.02) {
        shown = spring.target; spring.v = 0; spring.live = false;
      }
      shown = Math.min(1, Math.max(0, shown));
      progress = shown;
    }
    energy *= Math.pow(0.02, dt);
    pack.react(dt, dragging ? Math.max(-1, Math.min(1, vel * 6)) : 0, dragging);
    pack.setProgress(shown);
    pack.setTime(now / 1000, dragging ? 0.5 + energy : energy);
    if (shown > 0.96) again.setAttribute('data-on', '');
    if (!inspect) {
      camera.position.z = 0.205 - shown * 0.012;
      camera.position.y = CENTER_Y + 0.006 + shown * 0.012;
      controls.target.set(0, CENTER_Y + shown * 0.012, 0);
      controls.update();
    }
    paint();
    if (inspect) controls.update();
    requestAnimationFrame(frame);
  })(prev);
</script>
</body>
</html>
