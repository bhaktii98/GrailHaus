<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrailHaus — Black Label</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#020204;-webkit-user-select:none;user-select:none}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh;touch-action:none;background:transparent}

  /* fire-driven atmosphere: --fire 0..1, --surge 0..1 written from the loop */
  #vign{position:fixed;inset:0;pointer-events:none;--fire:0;--surge:0;
    background:
      radial-gradient(46% 34% at 50% 62%, rgba(255,106,24,calc(.16 * var(--fire) + .34 * var(--surge))), rgba(2,2,4,0) 66%),
      radial-gradient(120% 80% at 50% 118%, rgba(255,140,50,calc(.07 * var(--fire))), rgba(2,2,4,0) 60%),
      radial-gradient(130% 110% at 50% 48%, rgba(2,2,4,0) 34%, rgba(1,1,3,.9) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.32;mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.08) 1px, rgba(0,0,0,0) 1px);
    background-size:3px 3px}

  #frame{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:max(22px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
    pointer-events:none;font-family:"Cormorant Garamond",Georgia,serif;color:#f2ece2;
    transition:opacity .9s}
  #frame[data-quiet] .head{opacity:.18}
  .head{transition:opacity .9s}
  .kicker{display:flex;align-items:center;gap:10px;font:600 9px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.36em;color:#a5854a;text-transform:uppercase}
  .kicker span.rule{width:24px;height:1px;background:rgba(216,184,119,.45)}
  h1{margin:9px 0 0;font-size:clamp(30px,8vw,42px);font-weight:300;letter-spacing:.24em;
    text-transform:uppercase;color:#f7e6bd;
    text-shadow:0 0 40px rgba(255,140,50,.28)}
  .sub{margin-top:6px;font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.42em;
    text-transform:uppercase;color:rgba(242,236,226,.44)}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;
    font:400 9px/1.5 ui-monospace,Menlo,monospace;color:rgba(216,184,119,.6);letter-spacing:.16em}
  .meta i{font-style:normal;color:rgba(216,184,119,.3)}
  #hint{align-self:center;font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(242,236,226,.46);transition:opacity .5s;text-align:center}

  /* the rarity word: fade, tracking expansion, restrained lift */
  #grail{position:fixed;left:0;right:0;top:58%;text-align:center;pointer-events:none;
    font-family:"Cormorant Garamond",Georgia,serif;opacity:0;transition:opacity 1.4s ease}
  #grail .w{display:inline-block;font-size:clamp(34px,9vw,54px);font-weight:300;
    letter-spacing:.16em;text-transform:uppercase;color:#f7e6bd;
    transform:translateY(14px);transition:letter-spacing 2s cubic-bezier(.16,.7,.2,1),
      transform 2s cubic-bezier(.16,.7,.2,1);
    text-shadow:0 0 34px rgba(255,140,50,.5),0 0 90px rgba(255,90,20,.28)}
  #grail .u{width:0;height:1px;margin:16px auto 0;background:linear-gradient(90deg,
      rgba(216,184,119,0),rgba(247,230,189,.85),rgba(216,184,119,0));
    transition:width 2.2s cubic-bezier(.16,.7,.2,1)}
  #grail[data-on]{opacity:1}
  #grail[data-on] .w{letter-spacing:.5em;transform:translateY(0)}
  #grail[data-on] .u{width:min(280px,52vw)}

  /* collector sheet: smoked glass, hairline metal, no dashboard */
  #sheet{position:fixed;left:0;right:0;bottom:0;pointer-events:none;
    padding:26px 24px calc(max(26px,env(safe-area-inset-bottom)) + 14px);
    font-family:"Cormorant Garamond",Georgia,serif;color:#f2ece2;
    background:linear-gradient(180deg,rgba(4,4,8,0) 0%,rgba(5,4,8,.72) 26%,rgba(3,3,6,.94) 100%);
    opacity:0;transform:translateY(26px);
    transition:opacity 1s ease,transform 1.1s cubic-bezier(.16,.7,.2,1)}
  #sheet[data-on]{opacity:1;transform:translateY(0);pointer-events:auto}
  #sheet .top{display:flex;align-items:baseline;justify-content:space-between;gap:18px;
    border-top:1px solid rgba(216,184,119,.22);padding-top:16px}
  #sheet .name{font-size:clamp(24px,6vw,30px);font-weight:400;letter-spacing:.1em;
    text-transform:uppercase;color:#f7e6bd}
  #sheet .rar{font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.34em;
    color:#ff9330;white-space:nowrap}
  #sheet .line{margin-top:8px;font:400 10px/1.6 ui-monospace,Menlo,monospace;
    letter-spacing:.16em;color:rgba(242,236,226,.52)}
  #sheet .tag{margin-top:14px;font-size:17px;font-style:italic;font-weight:400;
    color:rgba(247,230,189,.86);max-width:46ch;text-wrap:pretty}
  #sheet .traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  #sheet .traits b{font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(242,236,226,.72);
    padding:8px 12px;border:1px solid rgba(216,184,119,.26);border-radius:1px;
    background:rgba(255,255,255,.03)}
  #sheet .val{display:flex;align-items:baseline;gap:12px;margin-top:18px}
  #sheet .val em{font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.24em;
    font-style:normal;color:rgba(242,236,226,.44)}
  #sheet .val strong{font-size:26px;font-weight:500;letter-spacing:.04em;color:#f7e6bd}
  #sheet .val span{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#7ed6a4}
  #sheet .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

  button{font-family:ui-monospace,Menlo,monospace;cursor:pointer;
    transition:transform .12s ease,border-color .25s,background .25s,box-shadow .25s}
  button:active{transform:translateY(1px) scale(.994)}
  .btn{padding:14px 22px;border-radius:1px;font:600 9px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.26em;text-transform:uppercase}
  .btn.primary{flex:1 1 220px;border:1px solid rgba(247,230,189,.5);color:#100c06;
    background:linear-gradient(180deg,#f7e6bd,#d8b877 62%,#b18f4f);
    box-shadow:0 10px 30px rgba(255,140,50,.14)}
  .btn.primary:hover{box-shadow:0 12px 40px rgba(255,140,50,.26)}
  .btn.ghost{border:1px solid rgba(216,184,119,.3);color:rgba(242,236,226,.86);
    background:rgba(255,255,255,.03)}
  .btn.ghost:hover{border-color:rgba(216,184,119,.6);background:rgba(255,255,255,.06)}

  .pill{position:fixed;padding:11px 18px;border:1px solid rgba(216,184,119,.32);border-radius:1px;
    background:rgba(6,5,10,.7);color:rgba(242,236,226,.9);font:600 9px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.24em;text-transform:uppercase;backdrop-filter:blur(12px);
    transition:opacity .4s,border-color .25s,background .25s,transform .12s}
  .pill:hover{border-color:rgba(216,184,119,.66);background:rgba(14,11,20,.82)}
  .pill[data-hidden]{opacity:0;pointer-events:none}
  #mode{right:24px;top:max(22px,env(safe-area-inset-top))}
  #again{left:24px;top:max(22px,env(safe-area-inset-top))}

  @media (min-width:860px){
    #sheet{left:auto;right:0;top:0;bottom:0;width:392px;padding:0 34px;
      display:flex;flex-direction:column;justify-content:center;transform:translateX(28px);
      border-left:1px solid rgba(216,184,119,.16);
      background:linear-gradient(270deg,rgba(4,4,8,.96) 0%,rgba(4,4,8,.9) 74%,rgba(4,4,8,.72) 100%);
      backdrop-filter:blur(18px)}
    #sheet[data-on]{transform:translateX(0)}
    #frame{right:392px}
    #grail{top:auto;bottom:7%;right:392px}
    #grail .w{font-size:clamp(30px,4vw,44px)}
  }
  a{color:#d8b877}a:hover{color:#f7e6bd}
</style>
</head>
<body>
<three-d-stage name="grailhaus-black-label" background="transparent"></three-d-stage>
<div id="vign"></div>
<div id="grain"></div>
<div id="frame">
  <div class="head">
    <div class="kicker"><span class="rule"></span>Tier III · Sealed</div>
    <h1>Black Label</h1>
    <div class="sub">Collectible cards</div>
    <div class="meta"><span>6 CARDS</span><i>/</i><span>1 PRIME OR ABOVE</span><i>/</i><span>GRAIL 1 IN 25</span></div>
  </div>
  <div></div>
  <div id="hint">Tap and drag to open</div>
</div>

<div id="grail"><div class="w">Grail</div><div class="u"></div></div>

<section id="sheet">
  <div class="top">
    <div class="name" id="s-name">—</div>
    <div class="rar" id="s-rar">GRAIL</div>
  </div>
  <div class="line" id="s-line">—</div>
  <div class="tag" id="s-tag"></div>
  <div class="traits" id="s-traits"></div>
  <div class="val">
    <em>Estimated value</em><strong id="s-val">—</strong><span id="s-delta"></span>
  </div>
  <div class="acts">
    <button class="btn primary" id="collect">Add to collection</button>
    <button class="btn ghost" id="list">List for sale</button>
    <button class="btn ghost" id="details">View details</button>
  </div>
</section>

<button class="pill" id="mode">Orbit</button>
<button class="pill" id="again" data-hidden>Reseal</button>
<script src="./three-d-stage.js"></script>
<script type="module">
  import * as THREE from 'three';
  import { buildPack } from './rip-pack.js';
  import { buildFire } from './fire.js';
  import { TIERS } from './tiers.js';

  if (document.fonts) { try { await document.fonts.ready; } catch (e) {} }

  const stage = document.querySelector('three-d-stage');
  await stage.ready;

  const logo = await new Promise((res) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = './uploads/grailhaus logo.png';
  });

  const cfg = TIERS['black-label'];
  const pack = buildPack(logo, cfg);
  const reveal = pack.reveal;
  stage.setObject(pack.group);

  // ---- fire: parented to the grail card, so it is the card's own energy ---
  const fire = buildFire({ cardW: pack.cardSize.w, cardH: pack.cardSize.h });
  const grail = reveal.grailCard;
  if (grail) grail.obj.add(fire.group);
  grail.faceMat.emissive = new THREE.Color(0x30100a);

  // The sealed pack burns too: the same system at pack scale, so heat is
  // already in the room before anything is opened, and it dies back once the
  // cards take over the story.
  const packFire = buildFire({ cardW: pack.size.W * 1.02, cardH: pack.size.H * 0.94, pack: true });
  packFire.group.name = 'packFire';
  pack.group.add(packFire.group);

  // ---- obsidian room -----------------------------------------------------
  const scene = stage._scene;
  scene.children.filter((o) => o.isLight).forEach((l) => scene.remove(l));

  const floorY = -pack.size.H / 2;
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(0.66, 0.66),
    new THREE.MeshStandardMaterial({
      name: 'apexFloor', color: 0x040407, roughness: 0.62, metalness: 0.36,
    }),
  );
  floor.name = 'apexFloor';
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = floorY - 0.0004;
  floor.receiveShadow = true;
  scene.add(floor);

  const backWall = new THREE.Mesh(
    new THREE.PlaneGeometry(0.98, 0.66),
    new THREE.MeshStandardMaterial({ name: 'apexWall', color: 0x030306, roughness: 0.95, metalness: 0.04 }),
  );
  backWall.name = 'apexWall';
  backWall.position.set(0, floorY + 0.25, -0.28);
  scene.add(backWall);

  // Studio rig, deliberately underpowered at rest: the room starts nearly
  // black and the fire does most of the lighting until the card is inspected.
  const key = new THREE.DirectionalLight(0xfff0d6, 2.1);
  key.position.set(0.17, 0.30, 0.30);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0004;
  Object.assign(key.shadow.camera, { left: -0.16, right: 0.16, top: 0.16, bottom: -0.16 });
  key.shadow.camera.updateProjectionMatrix();
  scene.add(key);

  const fill = new THREE.DirectionalLight(0x8c2408, 0.9);      // deep crimson fill
  fill.position.set(-0.30, 0.10, -0.20);
  scene.add(fill);

  // molten bounce from the fire the pack stands in
  const emberRim = new THREE.DirectionalLight(0xff7a1e, 1.15);
  emberRim.position.set(0.06, -0.16, 0.34);
  scene.add(emberRim);

  const kick = new THREE.DirectionalLight(0xd8b877, 0.5);     // gold edge kick
  kick.position.set(-0.16, -0.08, 0.26);
  scene.add(kick);

  const hemi = new THREE.HemisphereLight(0x2a1610, 0x050306, 0.4);
  scene.add(hemi);

  const spot = new THREE.SpotLight(0xfff2d8, 0, 0.6, 0.5, 0.92, 1.2);
  spot.position.set(0.02, 0.16, 0.16);
  scene.add(spot, spot.target);

  // the fire's own light — the thing that illuminates the environment
  const fireLight = new THREE.PointLight(0xff6a18, 0, 0.22, 2.2);
  fireLight.name = 'fireLight';
  scene.add(fireLight);
  const emberLight = new THREE.PointLight(0xff9330, 0, 0.2, 2.0);
  scene.add(emberLight);

  const packLight = new THREE.PointLight(0xff6a18, 0, 0.18, 2.4);  packLight.name = 'packFireLight';
  packLight.position.set(0.035, -pack.size.H * 0.06, 0.055);
  scene.add(packLight);

  // frontal card key: only lifts once the cards are out, so the collectibles
  // read clearly without brightening the sealed pack
  const cardKey = new THREE.DirectionalLight(0xfff4e2, 0);
  cardKey.position.set(0.05, 0.14, 0.42);
  scene.add(cardKey);

  if (stage._ground) stage._ground.material.opacity = 0.36;

  const controls = stage._controls;
  const camera = stage._camera;
  const CENTER_Y = 0.0;
  const BASE_Z = 0.218;
  const camAim = { x: 0, y: CENTER_Y + 0.006, z: BASE_Z, tx: 0, ty: CENTER_Y };
  const reframe = () => {
    camera.position.set(0, CENTER_Y + 0.006, BASE_Z);
    controls.target.set(0, CENTER_Y, 0);
    controls.update();
  };
  reframe();

  let orbit = false;
  const modeBtn = document.getElementById('mode');
  const setMode = (on) => {
    orbit = on;
    controls.enableRotate = on;
    controls.enableZoom = on;
    controls.enablePan = on;
    modeBtn.textContent = on ? 'Close orbit' : 'Orbit';
    if (stage._note) stage._note.textContent = on ? 'Drag to orbit · scroll to zoom' : '';
    if (!on) reframe();
  };
  modeBtn.addEventListener('click', () => setMode(!orbit));
  setMode(false);

  // ================= tear physics (unchanged model, tier-tuned) ==========
  const TEAR = cfg.tear;
  let progress = 0, dragging = false, vel = 0, energy = 0, touching = 0;
  const again = document.getElementById('again');
  const hint = document.getElementById('hint');
  const frame = document.getElementById('frame');
  const grailWord = document.getElementById('grail');
  const sheet = document.getElementById('sheet');
  const collect = document.getElementById('collect');
  const buzz = (ms) => navigator.vibrate && navigator.vibrate(ms);
  let ticks = 0;

  const cutSpan = () => {
    const p = new THREE.Vector3();
    const px = (x) => {
      p.set(x, pack.seamY, 0).applyMatrix4(pack.group.matrixWorld).project(camera);
      return (p.x * 0.5 + 0.5) * stage.clientWidth;
    };
    pack.group.updateMatrixWorld();
    const L = px(-pack.size.W / 2), R = px(pack.size.W / 2);
    return { L, span: Math.max(40, R - L) };
  };
  const cutAt = (clientX) => {
    const rect = stage.getBoundingClientRect();
    const { L, span } = cutSpan();
    return Math.min(1, Math.max(0, (clientX - rect.left - L) / span));
  };
  const cutRate = () => 1 / Math.max(40, cutSpan().span);
  const spring = { live: false, target: 0, v: 0 };

  let pid = null, lastX = 0, lastT = 0, grabStart = 0;
  const onTearStrip = (clientY) => {
    const rect = stage.getBoundingClientRect();
    const p = new THREE.Vector3();
    const py = (y) => {
      p.set(0, y, 0).applyMatrix4(pack.group.matrixWorld).project(camera);
      return (1 - (p.y * 0.5 + 0.5)) * stage.clientHeight;
    };
    pack.group.updateMatrixWorld();
    const top = py(pack.size.H / 2), seam = py(pack.seamY);
    const pad = Math.max(14, (seam - top) * 0.5);
    const y = clientY - rect.top;
    return y >= top - pad && y <= seam + pad;
  };

  // ---- collector sheet ---------------------------------------------------
  const fmt = (c) => {
    document.getElementById('s-name').textContent = c.data.name;
    document.getElementById('s-rar').textContent = c.data.rarity;
    document.getElementById('s-line').textContent =
      `${c.data.serial} · ${c.data.collection || 'Series I'} · ${c.data.type || 'Fire'} · ${c.data.edition}`;
    document.getElementById('s-tag').textContent = c.data.tagline ? `“${c.data.tagline}”` : '';
    const tr = document.getElementById('s-traits');
    tr.textContent = '';
    (c.data.traits || []).forEach((t) => {
      const b = document.createElement('b'); b.textContent = t; tr.appendChild(b);
    });
    document.getElementById('s-val').textContent = c.data.value;
    const d = document.getElementById('s-delta');
    d.textContent = `${c.data.delta >= 0 ? '▲' : '▼'} ${Math.abs(c.data.delta).toFixed(1)}% · 30D`;
    d.style.color = c.data.delta >= 0 ? '#7ed6a4' : '#d67e8c';
    sheet.setAttribute('data-on', '');
  };
  const closeSheet = () => sheet.removeAttribute('data-on');

  // ---- inspection routing ------------------------------------------------
  const ndc = new THREE.Vector2();
  const toNdc = (e) => {
    const r = stage.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    return ndc;
  };
  let heroPid = null;

  stage.addEventListener('pointerdown', (e) => {
    if (orbit) return;
    if (reveal.state.ready) {
      const i = reveal.pick(toNdc(e), camera);
      if (i >= 0) {
        reveal.setHero(i);
        fmt(reveal.cards[i]);
        grailWord.removeAttribute('data-on');
        heroPid = e.pointerId; lastX = e.clientX; lastT = e.clientY;
        stage.setPointerCapture(heroPid);
        buzz(8);
      } else if (reveal.state.hero >= 0) {
        reveal.setHero(-1);
        closeSheet();
      }
      return;
    }
    if (progress >= 1) return;
    if (!onTearStrip(e.clientY)) return;
    pid = e.pointerId; lastX = e.clientX; lastT = e.timeStamp;
    dragging = true; vel = 0; touching = 1;
    spring.live = false; spring.v = 0;
    grabStart = cutAt(e.clientX);
    stage.setPointerCapture(pid);
    hint.textContent = 'Drag to tear';
    buzz(6);
  });

  stage.addEventListener('pointermove', (e) => {
    if (heroPid !== null && e.pointerId === heroPid) {
      const r = stage.getBoundingClientRect();
      reveal.dragHero((e.clientX - lastX) / r.width, (e.clientY - lastT) / r.height);
      lastX = e.clientX; lastT = e.clientY;
      return;
    }
    if (e.pointerId !== pid) return;
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = (e.clientX - lastX) / dt;
    lastX = e.clientX; lastT = e.timeStamp;
    const raw = Math.max(0, cutAt(e.clientX) - grabStart);
    const S = TEAR.stretch;
    progress = S > 0 ? Math.min(1, Math.max(0, (raw - S) / (1 - S))) : Math.min(1, raw);
    pack.setStretch(S > 0 ? Math.min(1, raw / S) * (raw < S ? 1 : 0.25) : 0, grabStart + raw);
    energy = Math.min(1, energy + Math.abs(vel) * 0.06);
    const t = Math.floor(progress * 16);
    if (t !== ticks) { ticks = t; buzz(5); }
  });

  const up = (e) => {
    if (heroPid !== null && e.pointerId === heroPid) {
      heroPid = null; reveal.endDrag();
      return;
    }
    if (e.pointerId !== pid) return;
    pid = null; dragging = false; pack.setStretch(0, 0);
    const flick = e.timeStamp - lastT > 90 ? 0 : vel;
    spring.v = flick * cutRate() * 1000;
    const reach = Math.max(0.12, 1 - grabStart);
    spring.target = (progress > TEAR.releaseFrac * reach || flick > 0.95) ? 1 : 0;
    spring.live = true;
    if (spring.target === 1) buzz(38);
  };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', (e) => {
    if (reveal.state.hero >= 0 && !orbit) { reveal.zoomHero(e.deltaY * 0.0012); e.preventDefault(); }
  }, { passive: false });
  stage.addEventListener('dblclick', () => { if (reveal.state.hero >= 0) reveal.flipHero(); });

  again.addEventListener('click', () => {
    spring.live = false; spring.v = 0; spring.target = 0;
    progress = 0; shown = 0;
    reveal.reset();
    again.setAttribute('data-hidden', '');
    closeSheet();
    grailWord.removeAttribute('data-on');
    frame.removeAttribute('data-quiet');
    fire.setLevel(0);
    timers.forEach(clearTimeout); timers.length = 0;
    hint.textContent = 'Tap and drag to open';
    hint.style.opacity = 1;
  });
  collect.addEventListener('click', () => {
    const c = reveal.heroCard || reveal.grailCard;
    if (!c) return;
    collect.textContent = `Added · ${c.data.serial}`;
    buzz(20);
    setTimeout(() => { collect.textContent = 'Add to collection'; }, 2400);
  });
  document.getElementById('list').addEventListener('click', (e) => {
    e.target.textContent = 'Listing requested';
    setTimeout(() => { e.target.textContent = 'List for sale'; }, 2400);
  });
  document.getElementById('details').addEventListener('click', () => {
    const c = reveal.heroCard || reveal.grailCard;
    if (c) fmt(c);
  });

  Object.assign(window, {
    __pack: pack, __reveal: reveal, __fire: fire, __set: (p) => { progress = p; shown = p; },
  });

  // ---- render loop -------------------------------------------------------
  const renderer = stage._renderer;
  renderer.setAnimationLoop(null);
  renderer.toneMappingExposure = 1.05;
  const paint = () => {
    const r = stage.getBoundingClientRect();
    const w = Math.round(r.width) || innerWidth || 924;
    const h2 = Math.round(r.height) || innerHeight || 540;
    const cur = renderer.getSize(new THREE.Vector2());
    if (Math.abs(cur.x - w) > 0.5 || Math.abs(cur.y - h2) > 0.5) {
      renderer.setSize(w, h2, true);
      camera.aspect = w / h2;
      camera.updateProjectionMatrix();
    }
    renderer.render(scene, camera);
    return Math.abs(cur.x - w) < 0.5 && Math.abs(cur.y - h2) < 0.5;
  };
  [0, 50, 150, 400, 900].forEach((t) => setTimeout(paint, t));
  paint();
  addEventListener('resize', paint);
  document.addEventListener('visibilitychange', paint);
  new ResizeObserver(paint).observe(stage);
  if (document.fonts) document.fonts.ready.then(paint);

  const vign = document.getElementById('vign');
  const timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  let shown = 0, prev = performance.now(), lastPhase = '', sweptAt = -1;
  const wpos = new THREE.Vector3();

  (function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    if (dragging) {
      shown = progress;
    } else if (spring.live) {
      const k = TEAR.springK, c = 2 * Math.sqrt(TEAR.springK) * TEAR.damping;
      spring.v += ((spring.target - shown) * k - spring.v * c) * dt;
      shown += spring.v * dt;
      if (Math.abs(spring.target - shown) < 0.002 && Math.abs(spring.v) < 0.02) {
        shown = spring.target; spring.v = 0; spring.live = false;
      }
      shown = Math.min(1, Math.max(0, shown));
      progress = shown;
    }
    energy *= Math.pow(0.02, dt);
    touching *= Math.pow(0.05, dt);
    pack.react(dt, dragging ? Math.max(-1, Math.min(1, vel * 6)) : 0, dragging);
    pack.setProgress(shown);
    pack.setTime(now / 1000, dragging ? 0.5 + energy : energy);

    const st = reveal.state;
    if (shown > 0.96) again.removeAttribute('data-hidden');

    // ---- fire intensity: strictly tied to how far the reveal has come ----
    let want;
    if (!st.running && !st.ready) {
      // sealed: only what escapes the seam as the foil parts
      want = shown * 0.14 + energy * 0.05;
    } else if (st.ready) {
      want = st.hero >= 0 ? 0.3 : 0.4;
    } else {
      const ph = st.phase;
      want = ph === 'stack' || ph === 'hold' ? 0.16
        : ph === 'rise' ? 0.2
          : ph === 'separate' || ph === 'settle' ? 0.24
            : ph === 'notice' ? 0.3
              : ph === 'approach' ? 0.4 + st.emerge * 0.2
                : ph === 'reveal' ? 0.45 + st.emerge * 0.4
                  : 0.72;
    }
    fire.setLevel(want);
    const fx = fire.step(dt, camera, renderer.domElement.height);

    // the sealed pack's own fire: strong while it is the subject, then it
    // hands the heat over to the cards
    const packWant = !st.running && !st.ready
      ? 0.36 + shown * 0.34 + touching * 0.12 + energy * 0.12
      : st.ready ? 0.12 : 0.3;
    packFire.setLevel(packWant);
    const pfx = packFire.step(dt, camera, renderer.domElement.height);
    packLight.intensity = (0.03 + pfx.level * 0.16 + pfx.surge * 0.4) * pfx.flick;

    // the light sweep lands after the mid-emergence hold, before the turn
    if (st.phase === 'reveal' && sweptAt < 0 && st.emerge > 0.52) {
      sweptAt = 1; fire.runSweep();
    }

    // ---- lighting choreography ------------------------------------------
    const dim = st.dim;
    const phaseLight = st.hero >= 0 ? 1.35
      : st.ready ? 1.45
        : st.running ? 1.3
          : 2.1 + touching * 0.3 + shown * 0.3;
    key.intensity += (phaseLight * (1 - dim * 0.34) - key.intensity) * Math.min(1, dt * 2.4);
    const cardWant = st.hero >= 0 ? 0.7 : st.ready ? 0.6 : st.running ? 0.45 : 0;
    cardKey.intensity += (cardWant - cardKey.intensity) * Math.min(1, dt * 2.2);
    fill.intensity += ((0.4 + fx.level * 0.9) - fill.intensity) * Math.min(1, dt * 3);
    kick.intensity += ((0.24 + shown * 0.2 + fx.level * 0.3) - kick.intensity) * Math.min(1, dt * 3);
    hemi.intensity += ((0.14 + fx.level * 0.16) - hemi.intensity) * Math.min(1, dt * 3);
    const spotWant = st.hero >= 0 ? 0.8 : dim > 0.05 ? 2.0 * dim : 0;
    spot.intensity += (spotWant - spot.intensity) * Math.min(1, dt * 3.2);
    spot.target.position.lerp(st.focus, Math.min(1, dt * 4));
    if (st.hero >= 0) spot.position.set(0.012, st.focus.y + 0.05, st.focus.z + 0.19);
    else spot.position.set(st.focus.x * 0.5 + 0.02, st.focus.y + 0.14, st.focus.z + 0.14);

    // fire light rides with the grail card and flickers with the flames
    if (grail) {
      grail.obj.getWorldPosition(wpos);
      fireLight.position.set(wpos.x, wpos.y - pack.cardSize.h * 0.3, wpos.z + 0.006);
      emberLight.position.set(wpos.x, wpos.y + pack.cardSize.h * 0.4, wpos.z - 0.012);
    }
    fireLight.intensity = (Math.max(0, fx.level - 0.08) * 0.55 + fx.surge * 1.4) * fx.flick;
    emberLight.intensity = (Math.max(0, fx.level - 0.12) * 0.2 + fx.surge * 0.5) * fx.flick;

    vign.style.setProperty('--fire', Math.max(fx.level, pfx.level * 0.85).toFixed(3));
    vign.style.setProperty('--surge', fx.surge.toFixed(3));

    // ---- camera choreography --------------------------------------------
    if (!orbit) {
      const wide = innerWidth >= 860;
      const sheetOn = sheet.hasAttribute('data-on');
      const shiftX = sheetOn && wide ? 0.026 : 0;
      const shiftY = sheetOn && !wide ? 0.012 : 0;
      if (st.hero >= 0) {
        const h = reveal.heroCard.obj.position;
        camAim.z = 0.206; camAim.y = h.y * 0.9 + shiftY; camAim.x = shiftX;
        camAim.tx = shiftX; camAim.ty = h.y * 0.92 + shiftY;
      } else if (st.phase === 'notice' || st.phase === 'approach'
        || st.phase === 'reveal' || st.phase === 'present') {
        camAim.z = 0.264 - st.dim * 0.03;
        camAim.x = st.focus.x * 0.42 + shiftX;
        camAim.y = st.focus.y * 0.82 + 0.004 + shiftY;
        camAim.tx = st.focus.x * 0.5 + shiftX; camAim.ty = st.focus.y * 0.88 + shiftY;
      } else if (st.running || st.ready) {
        camAim.z = 0.262; camAim.x = shiftX;
        camAim.y = CENTER_Y + 0.022 + shiftY; camAim.tx = shiftX; camAim.ty = CENTER_Y + 0.022 + shiftY;
      } else {
        camAim.z = BASE_Z - shown * 0.014;
        camAim.x = 0;
        camAim.y = CENTER_Y + 0.006 + shown * 0.012;
        camAim.tx = 0; camAim.ty = CENTER_Y + shown * 0.012;
      }
      const slow = st.phase === 'notice' || st.phase === 'approach'
        || st.phase === 'reveal' || st.phase === 'present';
      const s = Math.min(1, dt * (slow ? 1.1 : 2.6));
      camera.position.x += (camAim.x - camera.position.x) * s;
      camera.position.y += (camAim.y - camera.position.y) * s;
      camera.position.z += (camAim.z - camera.position.z) * s;
      controls.target.set(
        controls.target.x + (camAim.tx - controls.target.x) * s,
        controls.target.y + (camAim.ty - controls.target.y) * s,
        0,
      );
      controls.update();
    }

    // ---- beats -----------------------------------------------------------
    if (st.phase !== lastPhase) {
      lastPhase = st.phase;
      if (st.phase === 'reveal') sweptAt = -1;
      if (st.phase === 'notice') frame.setAttribute('data-quiet', '');
      if (st.phase === 'present') {
        // contained energy released: one surge, then it settles
        fire.burst();
        buzz(60);
        later(900, () => grailWord.setAttribute('data-on', ''));
        later(2100, () => { if (grail) fmt(grail); });
      }
      if (st.phase === 'ready') {
        // the pack header recedes for good once the cards are out
        frame.setAttribute('data-quiet', '');
        hint.textContent = 'Tap a card to inspect · drag to rotate';
        hint.style.opacity = 1;
      } else if (st.running) {
        hint.style.opacity = 0;
      }
    }
    if (!st.running && !st.ready) hint.style.opacity = String(1 - shown * 1.6);
    else if (st.ready) hint.style.opacity = st.hero >= 0 ? '0' : '1';

    paint();
    if (orbit) controls.update();
    requestAnimationFrame(loop);
  })(prev);
</script>
</body>
</html>
