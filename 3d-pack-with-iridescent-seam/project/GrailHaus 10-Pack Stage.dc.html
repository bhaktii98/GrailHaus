<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  }
}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050409;-webkit-user-select:none;user-select:none}
  a{color:#d8a93f}a:hover{color:#ffe9ac}
  three-d-stage:not(:defined){visibility:hidden}
  @keyframes gh-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes gh-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
</style>
</helmet>

<div style="position:relative;width:100%;height:100vh;overflow:hidden;background:#050409;font-family:'Cormorant Garamond',Georgia,serif;color:#f0e8d8">

  <div ref="{{ mount }}" style="position:absolute;inset:0"></div>

  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(58% 44% at 50% 42%, rgba(120,70,190,.16), rgba(5,4,9,0) 64%), radial-gradient(120% 90% at 50% 118%, rgba(216,169,63,.10), rgba(5,4,9,0) 58%)"></div>

  <div style="position:absolute;left:0;top:0;padding:22px 24px;pointer-events:none;animation:gh-rise .6s ease both">
    <div style="font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.32em;color:#a98a4e;text-transform:uppercase">{{ kicker }}</div>
    <div style="margin-top:8px;font-size:clamp(22px,3.2vw,32px);font-weight:500;letter-spacing:.01em">Ten Packs, <em style="font-style:italic;color:#d8a93f">One Hunt</em></div>
    <div style="margin-top:8px;font:400 11px/1.5 ui-monospace,Menlo,monospace;color:#9a8bb5;letter-spacing:.08em">{{ hint }}</div>
  </div>

  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:24px;top:24px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none;animation:gh-rise .5s ease both">
      <div style="font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#c9b98f">{{ progressLabel }}</div>
      <div style="display:flex;gap:5px">
        <sc-for list="{{ pips }}" as="pip" hint-placeholder-count="10">
          <div style="{{ pip.style }}"></div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <sc-if value="{{ sealed }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ autoUnzip }}" style="display:flex;align-items:center;gap:12px;padding:13px 24px;border:1px solid rgba(216,169,63,.55);border-radius:999px;background:rgba(24,12,44,.84);color:#f6eeda;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)" style-hover="border-color:rgba(216,169,63,1);background:rgba(38,20,66,.94)">Unzip the pouch<span style="display:inline-block;color:#d8a93f;animation:gh-nudge 1.5s ease-in-out infinite">&#8594;</span></button>
    </sc-if>
    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ openNext }}" style="padding:12px 22px;border:1px solid rgba(216,169,63,.5);border-radius:999px;background:rgba(24,12,44,.82);color:#f6eeda;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)" style-hover="border-color:rgba(216,169,63,.95);background:rgba(38,20,66,.92)">Pull next pack</button>
    </sc-if>
    <button type="button" onClick="{{ reset }}" style="padding:12px 22px;border:1px solid rgba(154,139,181,.3);border-radius:999px;background:rgba(12,8,22,.6);color:#9a8bb5;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)" style-hover="color:#d8cbef;border-color:rgba(154,139,181,.6)">Reseal bundle</button>
  </div>

  <sc-if value="{{ ripOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:40;background:rgba(4,3,8,.95);backdrop-filter:blur(10px);display:flex;flex-direction:column;animation:gh-rise .3s ease both">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;border-bottom:1px solid rgba(216,169,63,.18)">
        <div>
          <div style="font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.28em;color:#a98a4e;text-transform:uppercase">Ripping</div>
          <div style="margin-top:6px;font-size:19px;font-weight:500">{{ ripTitle }}</div>
        </div>
        <div style="display:flex;gap:10px">
          <button type="button" onClick="{{ finishRip }}" style="padding:11px 20px;border:1px solid rgba(216,169,63,.5);border-radius:999px;background:rgba(24,12,44,.8);color:#f6eeda;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer" style-hover="border-color:rgba(216,169,63,.95)">Mark opened</button>
          <button type="button" onClick="{{ cancelRip }}" style="padding:11px 18px;border:1px solid rgba(154,139,181,.3);border-radius:999px;background:transparent;color:#9a8bb5;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;cursor:pointer" style-hover="color:#d8cbef">Back</button>
        </div>
      </div>
      <iframe src="./grailhaus-pack.html" title="Pack rip" style="flex:1;width:100%;border:0;background:#060608"></iframe>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:760},&quot;accentGold&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#d8a93f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#d8a93f&quot;,&quot;#e8c169&quot;,&quot;#c9962f&quot;,&quot;#ffe9ac&quot;]}}">
const KEY = 'grailhaus.tenpack.opened.v2';

class Component extends DCLogic {
  // phase: 'sealed' → 'spilling' → 'ready'
  state = { opened: [], ripIndex: null, phase: 'sealed' };
  zipP = 0;
  spillP = 0;
  autoZip = false;

  componentDidMount() {
    // Always start from the sealed bundle. Stale progress must never come back
    // as pre-opened packs — the ten packs are intact until each one is ripped.
    this.persist([]);
    this.boot();
  }

  componentWillUnmount() {
    this.dead = true;
    if (this.raf) cancelAnimationFrame(this.raf);
  }

  async boot() {
    const host = this.mountEl;
    if (!host || this.booted) return;
    this.booted = true;

    if (!document.querySelector('script[data-gh-stage]')) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = './three-d-stage.js';
        s.setAttribute('data-gh-stage', '');
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    await customElements.whenDefined('three-d-stage');
    if (document.fonts) { try { await document.fonts.ready; } catch (e) {} }

    const stage = document.createElement('three-d-stage');
    stage.setAttribute('name', 'grailhaus-ten-pack');
    stage.setAttribute('background', 'transparent');
    stage.style.cssText = 'display:block;width:100%;height:100%;touch-action:none;background:transparent';
    host.appendChild(stage);
    this.stage = stage;

    const { THREE } = await stage.ready;
    const { buildTenPack } = await import('./tenpack-art.js');
    this.THREE = THREE;

    const renderer = stage._renderer;
    if (renderer) {
      // the moving tear needs per-material clipping
      renderer.localClippingEnabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.95;
    }

    // The stage ships a bright neutral studio, which greys out a black-and-gold
    // set. Pull it down to a low ambient bed and let the scene's own lights read.
    if (stage._scene) {
      stage._scene.traverse((o) => {
        if (o.isHemisphereLight) o.intensity = 0.16;
        else if (o.isDirectionalLight) o.intensity *= 0.3;
      });
      // No env map means metals render near-black and gold reads grey. A small
      // violet/gold equirect gives the foil and the zipper something to reflect.
      if (renderer) {
        const w = 512, h = 256;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        const sky = g.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#0a0716');
        sky.addColorStop(0.42, '#2a1550');
        sky.addColorStop(0.55, '#6b3aa8');
        sky.addColorStop(0.72, '#3a1f14');
        sky.addColorStop(1, '#0c0810');
        g.fillStyle = sky; g.fillRect(0, 0, w, h);
        [[0.2, 0.36, '#c79bff'], [0.74, 0.4, '#ffd390'], [0.5, 0.16, '#ffffff']]
          .forEach(([x, y, col]) => {
            const bl = g.createRadialGradient(x * w, y * h, 0, x * w, y * h, w * 0.16);
            bl.addColorStop(0, col); bl.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = bl; g.fillRect(0, 0, w, h);
          });
        const eq = new THREE.CanvasTexture(c);
        eq.mapping = THREE.EquirectangularReflectionMapping;
        eq.colorSpace = THREE.SRGBColorSpace;
        const pmrem = new THREE.PMREMGenerator(renderer);
        stage._scene.environment = pmrem.fromEquirectangular(eq).texture;
        stage._scene.environmentIntensity = 0.55;
        pmrem.dispose();
        eq.dispose();
      }
    }

    const logo = await new Promise((res) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = './uploads/grailhaus logo.png';
    });

    const scene = buildTenPack(THREE, logo);
    this.scene = scene;
    stage.setObject(scene.group);

    // Hold the 3/4 elevated front view. The orbit is fenced so you can't swing
    // behind the pouch (which would show the back panel's art mirrored) or drop
    // under the floor.
    const cam = stage._camera, controls = stage._controls;
    if (cam && controls) {
      cam.near = 0.05;
      cam.far = 60;
      cam.updateProjectionMatrix();
      cam.position.set(0.2, 3.1, 6.1);
      controls.target.set(0, 0.4, 0.45);
      controls.minPolarAngle = 0.5;
      controls.maxPolarAngle = 1.3;
      controls.minAzimuthAngle = -0.6;
      controls.maxAzimuthAngle = 0.6;
      controls.minDistance = 4.4;
      controls.maxDistance = 8.5;
      controls.enablePan = false;
      controls.update();
    }

    this.ray = new THREE.Raycaster();
    this.ndc = new THREE.Vector2();
    const canvas = stage.shadowRoot && stage.shadowRoot.querySelector('canvas');
    if (canvas) {
      this.canvas = canvas;
      canvas.addEventListener('pointerdown', this.onDown);
      canvas.addEventListener('pointermove', this.onMove);
      window.addEventListener('pointerup', this.onUp);
    }

    const t0 = performance.now();
    let last = t0;
    const loop = () => {
      if (this.dead) return;
      const now = performance.now();
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      this.frame((now - t0) / 1000, dt);
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  }

  frame(t, dt) {
    const scene = this.scene;
    if (!scene) return;
    scene.tick(t);

    if (this.autoZip && this.zipP < 1) {
      this.zipP = Math.min(1, this.zipP + dt * 0.62);
      if (this.zipP >= 1) this.autoZip = false;
    }
    scene.setZip(this.zipP);

    if (this.zipP >= 1 && this.state.phase === 'sealed') this.setState({ phase: 'spilling' });

    if (this.state.phase !== 'sealed' && this.spillP < 1) {
      this.spillP = Math.min(1, this.spillP + dt * 0.75);
      if (this.spillP >= 1 && this.state.phase === 'spilling') this.setState({ phase: 'ready' });
    }
    scene.setSpill(this.spillP);

    if (this.state.phase === 'ready') this.decoratePacks(t);
  }

  // hover warms the foil and lifts the pack; opened packs sit flat and dimmed
  decoratePacks(t) {
    this.scene.packs.forEach((m, i) => {
      const done = this.state.opened.includes(i);
      const hot = this.hover === i && !done;
      if (done) {
        m.position.y = 0.03;
        m.rotation.x = -Math.PI / 2 + 0.04;
        m.scale.z = 0.45;
      } else if (hot) {
        m.position.y += 0.13 + Math.sin(t * 3.4) * 0.012;
      }
      const faces = Array.isArray(m.material) ? m.material.slice(4) : [m.material];
      faces.forEach((mat) => {
        mat.emissiveIntensity += ((hot ? 0.42 : 0) - mat.emissiveIntensity) * 0.16;
        const dim = done ? 0.34 : 1;
        mat.color.setScalar(mat.color.r + (dim - mat.color.r) * 0.14);
      });
    });
  }

  ndcOf(e) {
    const r = this.canvas.getBoundingClientRect();
    this.ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    return r;
  }

  hitSlider(e) {
    this.ndcOf(e);
    this.ray.setFromCamera(this.ndc, this.stage._camera);
    return this.ray.intersectObject(this.scene.slider, true).length > 0;
  }

  pickPack(e) {
    this.ndcOf(e);
    this.ray.setFromCamera(this.ndc, this.stage._camera);
    const hit = this.ray.intersectObjects(this.scene.packs, false)[0];
    return hit ? hit.object.userData.pack : null;
  }

  // Screen-space span of the zip axis, so dragging maps 1:1 to the seam.
  zipSpan() {
    const { THREE, stage, scene } = this;
    const r = this.canvas.getBoundingClientRect();
    const at = (x) => {
      const v = new THREE.Vector3(x, scene.zip.y, 0).project(stage._camera);
      return r.left + ((v.x + 1) / 2) * r.width;
    };
    return { a: at(scene.zip.x0), b: at(scene.zip.x1) };
  }

  onDown = (e) => {
    if (!this.scene) return;
    if (this.state.phase === 'sealed') {
      if (this.hitSlider(e)) {
        this.span = this.zipSpan();
        this.dragging = true;
        if (this.stage._controls) this.stage._controls.enabled = false;
        this.canvas.style.cursor = 'grabbing';
      }
      return;
    }
    if (this.state.phase !== 'ready') return;
    const i = this.pickPack(e);
    if (i === null || this.state.opened.includes(i)) return;
    this.setState({ ripIndex: i });
  };

  onMove = (e) => {
    if (!this.scene) return;
    if (this.dragging) {
      const { a, b } = this.span;
      this.zipP = Math.max(this.zipP, Math.max(0, Math.min(1, (e.clientX - a) / (b - a))));
      return;
    }
    if (this.state.phase === 'sealed') {
      this.canvas.style.cursor = this.hitSlider(e) ? 'grab' : 'default';
      return;
    }
    if (this.state.phase !== 'ready') return;
    const i = this.pickPack(e);
    const sealed = i !== null && !this.state.opened.includes(i);
    this.hover = sealed ? i : null;
    this.canvas.style.cursor = sealed ? 'pointer' : 'default';
  };

  onUp = () => {
    if (!this.dragging) return;
    this.dragging = false;
    if (this.stage._controls) this.stage._controls.enabled = true;
    if (this.canvas) this.canvas.style.cursor = 'default';
    // past halfway the zip carries itself the rest of the way
    if (this.zipP > 0.35) this.autoZip = true;
  };

  autoUnzip = () => { this.autoZip = true; };

  persist(opened) {
    try { localStorage.setItem(KEY, JSON.stringify(opened)); } catch (e) {}
  }

  finishRip = () => {
    const i = this.state.ripIndex;
    if (i === null) return;
    const opened = this.state.opened.includes(i) ? this.state.opened : [...this.state.opened, i];
    this.persist(opened);
    this.hover = null;
    this.setState({ opened, ripIndex: null });
  };

  cancelRip = () => this.setState({ ripIndex: null });

  openNext = () => {
    for (let i = 0; i < 10; i++) {
      if (!this.state.opened.includes(i)) { this.setState({ ripIndex: i }); return; }
    }
  };

  reset = () => {
    this.persist([]);
    location.reload();
  };

  renderVals() {
    const gold = this.props.accentGold ?? '#d8a93f';
    const { opened, phase } = this.state;
    const pips = Array.from({ length: 10 }, (_, i) => ({
      style: {
        width: '7px', height: '7px', borderRadius: '999px',
        background: opened.includes(i) ? gold : 'rgba(154,139,181,.28)',
        boxShadow: opened.includes(i) ? '0 0 10px rgba(216,169,63,.7)' : 'none',
        transition: 'background .3s, box-shadow .3s',
      },
    }));
    const hint = phase === 'sealed'
      ? 'DRAG THE ZIP PULL ACROSS THE SEAM'
      : phase === 'spilling' ? 'TEN PACKS, ALL TORN' : 'TAP A TORN PACK TO PULL ITS CARDS';
    return {
      pips, hint,
      kicker: phase === 'sealed' ? 'Sealed bundle · Series I' : 'Bundle opened · Series I',
      sealed: phase === 'sealed',
      ready: phase === 'ready',
      progressLabel: opened.length + ' / 10 OPENED',
      ripOpen: this.state.ripIndex !== null,
      ripTitle: this.state.ripIndex === null
        ? '' : 'Pack ' + String(this.state.ripIndex + 1).padStart(2, '0') + ' of 10',
      autoUnzip: this.autoUnzip,
      openNext: this.openNext,
      reset: this.reset,
      finishRip: this.finishRip,
      cancelRip: this.cancelRip,
      mount: (el) => { if (el) { this.mountEl = el; this.boot(); } },
    };
  }
}

</script>
</body>
</html>
