<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────────────────────── helpers ───────────────────────── */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const sat = v=>clamp(v,0,1);
const lerp = (a,b,t)=>a+(b-a)*t;
const easeInOut = t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut = t=>1-Math.pow(1-t,3);
const easeIn = t=>t*t*t;
const smooth = (e0,e1,x)=>{const t=sat((x-e0)/(e1-e0));return t*t*(3-2*t);};

function roundedRect(w,h,r){
  r=Math.min(r,Math.min(w,h)/2-1e-4);
  const s=new THREE.Shape();
  s.moveTo(-w/2+r,-h/2);
  s.lineTo(w/2-r,-h/2); s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  s.lineTo(w/2,h/2-r);  s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  s.lineTo(-w/2+r,h/2); s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  return s;
}
/** rounded slab: w along x, d along z, h along y, centered */
function slab(w,d,h,r=.01,bevel=.004){
  const bev=Math.min(bevel,h*0.32,r*0.6);
  const g=new THREE.ExtrudeGeometry(roundedRect(w,d,r),{
    depth:Math.max(h-2*bev,1e-4),bevelEnabled:bev>1e-4,bevelThickness:bev,bevelSize:bev,
    bevelSegments:3,curveSegments:10});
  g.rotateX(-Math.PI/2); g.center(); g.computeVertexNormals();
  return g;
}
function mesh(geo,mat,name,parent,pos){
  const m=new THREE.Mesh(geo,mat); m.name=name;
  if(pos) m.position.set(pos[0],pos[1],pos[2]);
  m.castShadow=false; m.receiveShadow=false;
  if(parent) parent.add(m);
  return m;
}
/** flat silk strip following a CatmullRom curve through pts */
function ribbonGeometry(pts,width,seg,fall=0){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])),false,'catmullrom',.4);
  const pos=[],nor=[],uv=[],idx=[];
  const X=new THREE.Vector3(1,0,0),UP=new THREE.Vector3(0,1,0);
  for(let i=0;i<=seg;i++){
    const t=i/seg, p=curve.getPointAt(t), tg=curve.getTangentAt(t);
    const hp=new THREE.Vector3().crossVectors(tg,UP);
    if(hp.lengthSq()<1e-7) hp.copy(X); else hp.normalize();
    const b=X.clone().lerp(hp,fall).normalize();
    const n=new THREE.Vector3().crossVectors(b,tg).normalize();
    for(const s of [-.5,.5]){
      const v=p.clone().addScaledVector(b,s*width);
      pos.push(v.x,v.y,v.z); nor.push(n.x,n.y,n.z); uv.push(t,s+.5);
    }
  }
  for(let i=0;i<seg;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}
const lerpPts=(a,b,t)=>a.map((p,i)=>[lerp(p[0],b[i][0],t),lerp(p[1],b[i][1],t),lerp(p[2],b[i][2],t)]);

/* ───────────────────────── renderer ───────────────────────── */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.62;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x040405,1);
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.02,20);
camera.position.set(.40,.30,.48);

/* studio environment (dark room with one soft overhead strip) */
function studioEnv(){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#22211f'); g.addColorStop(.42,'#121213');
  g.addColorStop(.55,'#0a0a0b'); g.addColorStop(1,'#050506');
  x.fillStyle=g; x.fillRect(0,0,512,256);
  const s=x.createRadialGradient(150,54,4,150,54,150);
  s.addColorStop(0,'#ffffff'); s.addColorStop(.35,'#8d8a84'); s.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=s; x.fillRect(0,0,512,190);
  const w=x.createRadialGradient(392,88,4,392,88,120);
  w.addColorStop(0,'#e8c89a'); w.addColorStop(.4,'#4d4034'); w.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=w; x.fillRect(200,0,312,220);
  const t=new THREE.CanvasTexture(c);
  t.mapping=THREE.EquirectangularReflectionMapping; t.colorSpace=THREE.SRGBColorSpace;
  const pm=new THREE.PMREMGenerator(renderer);
  const env=pm.fromEquirectangular(t).texture;
  pm.dispose(); t.dispose(); return env;
}
scene.environment=studioEnv();
scene.environmentIntensity=.5;

/* ───────────────────────── materials ───────────────────────── */
const M={
  lacquer:new THREE.MeshPhysicalMaterial({name:'obsidian_lacquer',color:0x07070a,roughness:.13,metalness:.1,
    clearcoat:1,clearcoatRoughness:.045,envMapIntensity:1.15}),
  lacquerEdge:new THREE.MeshPhysicalMaterial({name:'obsidian_lacquer_edge',color:0x0b0b0e,roughness:.22,metalness:.1,
    clearcoat:1,clearcoatRoughness:.08,envMapIntensity:.9}),
  goldPolish:new THREE.MeshStandardMaterial({name:'champagne_gold_polished',color:0xc8a86d,roughness:.14,metalness:1,envMapIntensity:1.5}),
  goldBrush:new THREE.MeshStandardMaterial({name:'champagne_gold_brushed',color:0xb1955f,roughness:.42,metalness:1,envMapIntensity:1.1}),
  velvet:new THREE.MeshPhysicalMaterial({name:'black_velvet',color:0x050404,roughness:1,metalness:0,envMapIntensity:.16,
    sheen:.5,sheenRoughness:.9,sheenColor:new THREE.Color(0x2b2426)}),
  velvetWine:new THREE.MeshStandardMaterial({name:'burgundy_velvet',color:0x300a14,roughness:.94,metalness:0,envMapIntensity:.3}),
  leather:new THREE.MeshStandardMaterial({name:'black_leather',color:0x161315,roughness:.72,metalness:.05,envMapIntensity:.5}),
  silk:new THREE.MeshPhysicalMaterial({name:'wine_silk_ribbon',color:0x480d1c,roughness:.56,metalness:0,
    sheen:.7,sheenRoughness:.45,sheenColor:new THREE.Color(0x8c4a57),side:THREE.DoubleSide,envMapIntensity:.8}),
  steel:new THREE.MeshStandardMaterial({name:'polished_steel',color:0xe8edf1,roughness:.12,metalness:.95,envMapIntensity:2.4}),
  steelBrush:new THREE.MeshStandardMaterial({name:'brushed_steel',color:0xc2c8ce,roughness:.34,metalness:.92,envMapIntensity:1.6}),
  dial:new THREE.MeshStandardMaterial({name:'obsidian_dial',color:0x06070b,roughness:.52,metalness:.12,envMapIntensity:.30}),
  crystal:new THREE.MeshPhysicalMaterial({name:'sapphire_crystal',color:0xffffff,roughness:.03,metalness:0,
    transparent:true,opacity:.13,ior:1.77,envMapIntensity:1.1,depthWrite:false,
    clearcoat:1,clearcoatRoughness:.02}),
  goldApplied:new THREE.MeshStandardMaterial({name:'applied_gold',color:0xd9bd8a,roughness:.26,metalness:.55,envMapIntensity:1.0}),
  floor:new THREE.MeshStandardMaterial({name:'studio_floor',color:0x090909,roughness:.55,metalness:.15,envMapIntensity:.35}),
};

/* ───────────────────────── APEX_VAULT ───────────────────────── */
const W=.34,D=.26,H=.086,T=.015,LID=.028;
const IW=W-2*T, ID=D-2*T, FLOOR_Y=.018;

const vault=new THREE.Group(); vault.name='APEX_VAULT'; scene.add(vault);

/* floor */
const floor=mesh(new THREE.PlaneGeometry(6,6),M.floor,'StudioFloor',scene);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true;

/* — OuterShell — */
const shell=new THREE.Group(); shell.name='OuterShell'; vault.add(shell);
mesh(slab(W,D,FLOOR_Y,.016,.005),M.lacquer,'ShellBase',shell,[0,FLOOR_Y/2,0]).castShadow=true;
const wallH=H-FLOOR_Y;
mesh(slab(W,T,wallH,.008,.004),M.lacquer,'WallBack',shell,[0,FLOOR_Y+wallH/2,-D/2+T/2]);
mesh(slab(W,T,wallH,.008,.004),M.lacquer,'WallFront',shell,[0,FLOOR_Y+wallH/2,D/2-T/2]);
mesh(slab(T,ID,wallH,.008,.004),M.lacquer,'WallLeft',shell,[-W/2+T/2,FLOOR_Y+wallH/2,0]);
mesh(slab(T,ID,wallH,.008,.004),M.lacquer,'WallRight',shell,[W/2-T/2,FLOOR_Y+wallH/2,0]);
/* plinth shadow line + foot rail */
mesh(slab(W-.03,D-.03,.006,.01,.002),M.lacquerEdge,'Plinth',shell,[0,.003,0]);

/* — GoldInlay (exterior) — */
const inlay=new THREE.Group(); inlay.name='GoldInlay'; vault.add(inlay);
function goldLine(len,axis,pos,thick=.0016,depth=.0012,mat=M.goldPolish,name='InlayLine'){
  const g=axis==='x'?slab(len,depth,thick,.0004,.0002):slab(depth,len,thick,.0004,.0002);
  return mesh(g,mat,name,inlay,pos);
}
/* rim line just under the lid seam */
goldLine(W-.004,'x',[0,H-.006,D/2+.0005],.0011,.0016,M.goldPolish,'SeamLineFront');
goldLine(W-.004,'x',[0,H-.006,-D/2-.0005],.0011,.0016,M.goldPolish,'SeamLineBack');
goldLine(D-.004,'z',[W/2+.0005,H-.006,0],.0011,.0016,M.goldPolish,'SeamLineRight');
goldLine(D-.004,'z',[-W/2-.0005,H-.006,0],.0011,.0016,M.goldPolish,'SeamLineLeft');
/* base rail */
goldLine(W-.012,'x',[0,.0075,D/2+.0006],.0009,.0014,M.goldBrush,'BaseRailFront');
goldLine(W-.012,'x',[0,.0075,-D/2-.0006],.0009,.0014,M.goldBrush,'BaseRailBack');
/* corner uprights — delicate filigree-inspired verticals */
for(const sx of [-1,1]) for(const sz of [-1,1]){
  const c=new THREE.Group(); c.name='CornerDetail'; c.position.set(sx*(W/2-.014),0,sz*(D/2-.014)); inlay.add(c);
  mesh(slab(.026,.0012,.0009,.0003,.0002),M.goldPolish,'CornerArmX',c,[-sx*.008,FLOOR_Y+.012,sz*(.014)+.0002]);
  mesh(slab(.0012,.024,.0009,.0003,.0002),M.goldPolish,'CornerArmZ',c,[sx*.0142,FLOOR_Y+.012,-sz*.007]);
  mesh(new THREE.CylinderGeometry(.0022,.0022,.0008,20),M.goldBrush,'CornerStud',c,[0,FLOOR_Y+.012,sz*.0142]);
}
/* front plaque */
const plaque=mesh(slab(.052,.0018,.011,.0012,.0006),M.goldBrush,'FrontPlaque',inlay,[0,.036,D/2+.0009]);
mesh(slab(.038,.0012,.0006,.0002,.0001),M.goldPolish,'PlaqueEngrave',inlay,[0,.036,D/2+.0019]);

/* — Lid + HingeSystem — */
const hinge=new THREE.Group(); hinge.name='HingeSystem';
hinge.position.set(0,H+.0005,-D/2+.006); vault.add(hinge);
const lid=new THREE.Group(); lid.name='Lid'; hinge.add(lid);
const lidOffZ=D/2-.006;
mesh(slab(W,D,LID,.016,.006),M.lacquer,'LidShell',lid,[0,LID/2,lidOffZ]).castShadow=true;
/* lid underside liner */
mesh(slab(IW-.004,ID-.004,.004,.008,.0015),M.leather,'LidLiner',lid,[0,.0015,lidOffZ]);
mesh(slab(IW+.004,ID+.004,.0014,.008,.0005),M.goldBrush,'LidLinerFrame',lid,[0,.0032,lidOffZ]);
/* lid gold architecture */
const lidTop=LID+.0004;
function lidFrame(w,d,t,mat,nm){
  mesh(slab(w,t,.0011,.0004,.0002),mat,nm+'N',lid,[0,lidTop,lidOffZ-d/2]);
  mesh(slab(w,t,.0011,.0004,.0002),mat,nm+'S',lid,[0,lidTop,lidOffZ+d/2]);
  mesh(slab(t,d,.0011,.0004,.0002),mat,nm+'W',lid,[-w/2,lidTop,lidOffZ]);
  mesh(slab(t,d,.0011,.0004,.0002),mat,nm+'E',lid,[w/2,lidTop,lidOffZ]);
}
lidFrame(W-.028,D-.028,.0018,M.goldPolish,'LidBorderOuter');
lidFrame(W-.044,D-.044,.0009,M.goldBrush,'LidBorderInner');
/* art-deco stepped corners on the lid */
for(const sx of [-1,1]) for(const sz of [-1,1]){
  for(let k=0;k<3;k++){
    const l=.020-k*.006;
    mesh(slab(l,.0009,.0009,.0003,.0002),M.goldPolish,'DecoStepX',lid,
      [sx*((W-.044)/2-l/2-.0015),lidTop,lidOffZ+sz*((D-.044)/2-.006-k*.0055)]);
  }
}
/* — Emblem — */
const emblem=new THREE.Group(); emblem.name='Emblem'; emblem.position.set(0,lidTop-.0002,lidOffZ); lid.add(emblem);
mesh(new THREE.TorusGeometry(.026,.00075,10,96),M.goldPolish,'EmblemRingOuter',emblem,[0,.0008,0]).rotation.x=Math.PI/2;
mesh(new THREE.TorusGeometry(.0185,.00045,10,84),M.goldBrush,'EmblemRingInner',emblem,[0,.0008,0]).rotation.x=Math.PI/2;
const gh=mesh(slab(.011,.011,.0011,.0008,.0004),M.goldPolish,'EmblemDiamond',emblem,[0,.0009,0]);
gh.rotation.y=Math.PI/4;
mesh(slab(.0045,.0045,.0013,.0003,.0002),M.lacquerEdge,'EmblemCore',emblem,[0,.0013,0]).rotation.y=Math.PI/4;
for(let i=0;i<8;i++){
  const a=i*Math.PI/4, r=.0225;
  const t=mesh(slab(.0055,.0007,.0007,.0002,.0001),M.goldPolish,'EmblemRay'+i,emblem,
    [Math.sin(a)*r,.0008,Math.cos(a)*r]);
  t.rotation.y=a;
}

/* — Interior — */
const interior=new THREE.Group(); interior.name='Interior'; vault.add(interior);
const vel=new THREE.Group(); vel.name='VelvetLining'; interior.add(vel);
mesh(slab(IW,ID,.004,.004,.0012),M.velvet,'VelvetFloor',vel,[0,FLOOR_Y+.002,0]).receiveShadow=true;
const linH=H-FLOOR_Y-.004;
mesh(slab(IW,.004,linH,.002,.001),M.velvet,'VelvetWallBack',vel,[0,FLOOR_Y+.004+linH/2,-ID/2+.002]);
mesh(slab(IW,.004,linH,.002,.001),M.velvetWine,'VelvetWallFront',vel,[0,FLOOR_Y+.004+linH/2,ID/2-.002]);
mesh(slab(.004,ID-.008,linH,.002,.001),M.velvetWine,'VelvetWallLeft',vel,[-IW/2+.002,FLOOR_Y+.004+linH/2,0]);
mesh(slab(.004,ID-.008,linH,.002,.001),M.velvetWine,'VelvetWallRight',vel,[IW/2-.002,FLOOR_Y+.004+linH/2,0]);
/* gold interior trim on the rim */

function mistTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.35,'rgba(255,255,255,.45)');
  g.addColorStop(.72,'rgba(255,255,255,.12)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128);
  for(let i=0;i<9;i++){
    const r=18+Math.random()*26, px=32+Math.random()*64, py=32+Math.random()*64;
    const gg=x.createRadialGradient(px,py,1,px,py,r);
    gg.addColorStop(0,'rgba(255,255,255,.16)'); gg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gg; x.fillRect(0,0,128,128);
  }
  const mask=x.createRadialGradient(64,64,6,64,64,63);
  mask.addColorStop(0,'rgba(255,255,255,1)'); mask.addColorStop(.6,'rgba(255,255,255,.55)');
  mask.addColorStop(1,'rgba(255,255,255,0)');
  x.globalCompositeOperation='destination-in'; x.fillStyle=mask; x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

  const early=i%2===0;                        /* half are already spilling as the lid cracks */
  const x0=(Math.random()*2-1)*.145, z0=(Math.random()*2-1)*.092;
  const m=new THREE.SpriteMaterial({map:mistTex,transparent:true,opacity:0,depthWrite:false,
    color:new THREE.Color().setHSL(.08,.05,.52+Math.random()*.16)});
  const sp=new THREE.Sprite(m); sp.name='MistPuff'+i; mistGrp.add(sp);
  mist.push({sp,m,core:false,x0,z0,y0:.022+Math.random()*.028,
    lift:.048+Math.random()*.042, drop:.055+Math.random()*.075,
    /* the spill runs left and right — the mist escapes off the two sides of the vault */
    ang:(x0<0?Math.PI:0)+(Math.random()-.5)*.85,
    reach:.10+Math.random()*.26, s0:.034+Math.random()*.046,
    op:.20+Math.random()*.18, rot:Math.random()*6.28, spin:(Math.random()-.5)*1.3,
    spillAt:early?.05:.26,
    t0:early?Math.random()*.10:Math.random()*.40,
    dur:early?.34+Math.random()*.26:.48+Math.random()*.46});
}
function updateMist(F,t,ceil,lidUp){
  mistGrp.visible=F>.002&&F<.999;   /* nothing renders while the vault is still sealed */
  if(!mistGrp.visible) return;
  const dense=1-smooth(.44,.95,F);            /* opaque → translucent → empty */
  const k=.55+.36*Math.min(1,lidUp*1.3);      /* the vapour column can only rise with the lid */
  mistVolMat.opacity=dense*.9;
  mistVol.visible=mistVolInner.visible=dense>.004;
  mistVol.scale.y=k; mistVol.position.y=.020+.045*k;
  mistVolInner.scale.y=k*.96; mistVolInner.position.y=.020+.043*k*.96;
  for(const p of mist){
    if(p.core){
      if(dense<=.003){ p.sp.visible=false; continue; }
      p.sp.visible=true;
      p.sp.position.set(p.x0+Math.sin(t*.17+p.ph)*.007,
        Math.min(p.y0+Math.sin(t*.21+p.ph*1.7)*.004+(1-dense)*.034,ceil),
        p.z0+Math.cos(t*.14+p.ph)*.007);
      const s=p.s0*(1+(1-dense)*.55);
      p.sp.scale.set(s,s,1);
      p.m.rotation=p.rot+t*p.spin*.08;
      p.m.opacity=p.op*dense;
      continue;
    }
    const u=sat((F-p.t0)/p.dur);
    if(u<=0||u>=1){ p.sp.visible=false; continue; }
    p.sp.visible=true;
    const climb=easeOut(sat(u/.34)), spill=smooth(p.spillAt,1,u);
    const r=spill*p.reach;
    const nx=p.x0+Math.cos(p.ang)*r, inBox=Math.abs(nx)<.17;
    p.sp.position.set(nx,
      clamp(p.y0+climb*p.lift-spill*spill*p.drop,.004,inBox?ceil:.14), p.z0+Math.sin(p.ang)*r);
    const s=p.s0*(1+spill*2.1);
    p.sp.scale.set(s,s,1);
    p.m.rotation=p.rot+u*p.spin;
    p.m.opacity=p.op*smooth(0,.13,u)*(1-smooth(.58,1,u));
  }
}

/* ───────────────────────── audio ───────────────────────── */
let AC=null, master=null, soundOn=true, fabricSrc=null, fabricGain=null, servoGain=null;
function audio(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.85; master.connect(AC.destination);
  const n=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=n.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.6;
  fabricSrc=AC.createBufferSource(); fabricSrc.buffer=n; fabricSrc.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1650; bp.Q.value=.7;
  fabricGain=AC.createGain(); fabricGain.gain.value=0;
  fabricSrc.connect(bp).connect(fabricGain).connect(master); fabricSrc.start();
  return AC;
}
function click(freq=2100,g=.06,dur=.05){
  if(!soundOn||!AC) return;
  const o=AC.createOscillator(),gn=AC.createGain();
  o.type='triangle'; o.frequency.value=freq;
  gn.gain.setValueAtTime(g,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(gn).connect(master); o.start(); o.stop(AC.currentTime+dur+.02);
}
function thud(){
  if(!soundOn||!AC) return;
  const o=AC.createOscillator(),gn=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sine'; o.frequency.setValueAtTime(120,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(48,AC.currentTime+.32);
  f.type='lowpass'; f.frequency.value=320;
  gn.gain.setValueAtTime(.10,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.45);
  o.connect(f).connect(gn).connect(master); o.start(); o.stop(AC.currentTime+.5);
}
function servo(on){
  if(!AC) return;
  if(!servoGain){
    const o=AC.createOscillator(),o2=AC.createOscillator();
    servoGain=AC.createGain(); servoGain.gain.value=0;
    o.type='sine'; o.frequency.value=88; o2.type='sine'; o2.frequency.value=132.5;
    const g2=AC.createGain(); g2.gain.value=.4; o2.connect(g2).connect(servoGain);
    o.connect(servoGain); servoGain.connect(master); o.start(); o2.start();
  }
  servoGain.gain.linearRampToValueAtTime(on&&soundOn?.022:0, AC.currentTime+.6);
}
function chime(){
  if(!soundOn||!AC) return;
  [784,1176,1568].forEach((f,i)=>{
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type='sine'; o.frequency.value=f;
    gn.gain.setValueAtTime(0,AC.currentTime);
    gn.gain.linearRampToValueAtTime(.022/(i+1),AC.currentTime+.06);
    gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+3.2);
    o.connect(gn).connect(master); o.start(); o.stop(AC.currentTime+3.3);
  });
}
const haptic=ms=>{ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} };

/* ───────────────────────── state ───────────────────────── */
const S={
  phase:'ribbon',          // ribbon → release → pause → lid → sequence → inspect
  ribbon:0, ribbonVel:0,
  lidP:0, lidTarget:0,
  fall:0, fallT:0,
  seqI:-1, seqT:0,
  rise:0, tilt:0, fogP:0,
  camFrom:null, camTo:null,
  dark:0,
};
const el={
  prompt:document.getElementById('prompt'),
  refs:document.getElementById('refs'),
  promptLine:document.querySelector('#prompt .line'),
  apex:document.getElementById('apex'),
  apexRule:document.querySelector('#apex .rule'),
  meta:document.getElementById('meta'),
  skip:document.getElementById('btnSkip'),
  replay:document.getElementById('btnReplay'),
  sound:document.getElementById('btnSound'),
};
const CAM={
  closed:{p:[.40,.30,.48],t:[0,.055,0]},
  ribbon:{p:[.20,.175,.40],t:[0,.046,.10]},
  lidOpen:{p:[.17,.265,.355],t:[0,.075,-.01]},
  wide:{p:[.325,.300,.500],t:[0,.058,0]},
  wideNear:{p:[.262,.262,.424],t:[0,.068,0]},
  inspect:{p:[.055,.194,.100],t:[0,.128,0]},
};
const v3=a=>new THREE.Vector3(a[0],a[1],a[2]);
const camTarget=new THREE.Vector3(0,.055,0);
function setCam(k,ease=1){
  const A=S.camFrom,B=CAM[k];
  camera.position.lerpVectors(v3(A.p),v3(B.p),ease);
  camTarget.lerpVectors(v3(A.t),v3(B.t),ease);
  camera.lookAt(camTarget);
}
function snapFrom(){
  S.camFrom={p:[camera.position.x,camera.position.y,camera.position.z],
             t:[camTarget.x,camTarget.y,camTarget.z]};
}
S.camFrom=CAM.closed;
camera.position.copy(v3(CAM.closed.p)); camTarget.copy(v3(CAM.closed.t)); camera.lookAt(camTarget);

/* ───────────────────────── sequence (states 08–15) ───────────────────────── */
const SEQ=[
  { name:'RevealPause', dur:1.6, cam:'wide', fn:u=>{
      S.fogP=Math.max(S.fogP,.58+u*.06);
      chamber.intensity=.085+.030*easeInOut(u);
    }},
  { name:'VaultBreath', dur:2.8, cam:'wide', fn:u=>{
      S.fogP=.64+u*.10;
      chamber.intensity=lerp(.115,.175,u); chamber2.intensity=lerp(.05,.08,u);
      key.intensity=lerp(9,7.4,u);
      scene.environmentIntensity=lerp(.5,.40,u);
      S.dark=u*.22;
    }},
  { name:'MistSpill', dur:4.8, cam:'wideNear', enter:()=>{
      servo(true);
      reveal.position.set(.09,.30,.13); reveal.target.position.set(0,.122,0); reveal.angle=.30;
    }, fn:u=>{
      S.fogP=.74+u*.14;
      S.rise=easeInOut(smooth(.10,.92,u));   /* the cushion rises unseen inside the mist */
      reveal.intensity=0;
      key.intensity=lerp(7.4,6.4,u);
      S.dark=lerp(.22,.34,u);
    }},
  { name:'MistClear', dur:4.0, cam:'wideNear', enter:()=>servo(false), fn:u=>{
      S.fogP=.88+u*.12;
      S.rise=1;
      /* the mist thins to nothing and the watch is simply there, taking the light */
      reveal.intensity=lerp(0,.30,smooth(.46,1,u));
      chamber.intensity=lerp(.175,.135,u);
      key.intensity=lerp(6.4,6.0,u);
      S.dark=lerp(.34,.26,u);
    }},
  { name:'FinalApproach', dur:5.2, cam:'inspect', enter:()=>{
      el.apex.style.transition='opacity 2.2s ease';
      requestAnimationFrame(()=>{ el.apex.style.opacity='1'; el.apexRule.style.width='186px'; });
      chime();
      sweep.position.set(.26,.30,.20); sweep.target.position.set(0,.132,0);
    }, fn:u=>{
      S.fogP=1;
      S.tilt=easeInOut(smooth(.05,.65,u));
      apexL.intensity=lerp(0,.34,smooth(0,.5,u));
      sweep.intensity=lerp(0,.50,easeInOut(u));
      reveal.intensity=lerp(.30,.44,easeInOut(sat(u/.5)));
      scene.environmentIntensity=lerp(.40,.54,u);
      S.dark=lerp(.26,.18,u);
      if(u>.72){ el.apex.style.opacity=String(1-smooth(.72,.96,u)); el.apexRule.style.width='0px'; }
    }},
];

/* ───────────────────────── interaction ───────────────────────── */
let controls=null;
function enterInspection(){
  S.phase='inspect';
  controls=new OrbitControls(camera,renderer.domElement);
  controls.target.copy(v3(CAM.inspect.t));
  controls.enableDamping=true; controls.dampingFactor=.055;
  controls.rotateSpeed=.55; controls.zoomSpeed=.6; controls.panSpeed=.4;
  controls.enablePan=false;
  controls.minDistance=.085; controls.maxDistance=.62;
  controls.minPolarAngle=.18; controls.maxPolarAngle=Math.PI*.86;
  controls.update();
  el.meta.style.opacity='1';
  el.refs.style.opacity='1'; el.refs.style.pointerEvents='auto';
  el.skip.style.display='none';
  el.replay.style.display='';
  app.style.cursor='grab';
}
function startSequence(){
  S.phase='sequence'; S.seqI=0; S.seqT=0; snapFrom();
  el.prompt.style.opacity='0';
  el.refs.style.opacity='0'; el.refs.style.pointerEvents='none';
  if(SEQ[0].enter) SEQ[0].enter();
}
STYLES.forEach((s,i)=>{
  const b=document.createElement('button'); b.type='button'; b.textContent=s.name;
  b.addEventListener('click',()=>{ if(S.phase==='sequence') return; mountWatch(i); syncRefs(); });
  el.refs.appendChild(b);
});
function syncRefs(){
  [...el.refs.children].forEach((b,i)=>b.classList.toggle('on',i===styleIndex));
  document.getElementById('metaName').textContent=STYLES[styleIndex].name;
  document.getElementById('metaSub').textContent=STYLES[styleIndex].sub;
}
syncRefs();

let drag=null;
app.addEventListener('pointerdown',e=>{
  if(S.phase!=='ribbon'&&S.phase!=='lid') return;
  audio(); if(AC.state==='suspended') AC.resume();
  drag={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};
  app.setPointerCapture?.(e.pointerId);
  app.style.cursor='grabbing';
});
app.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.px, dy=e.clientY-drag.py;
  drag.px=e.clientX; drag.py=e.clientY;
  const unit=Math.min(innerWidth,innerHeight);
  if(S.phase==='ribbon'){
    const add=(Math.abs(dx)>Math.abs(dy)?Math.abs(dx):0)/(unit*.52);
    S.ribbon=clamp(S.ribbon+add,0,1);
    S.ribbonVel=Math.abs(dx)/16;
    if(S.ribbon>=1) releaseRibbon();
  } else if(S.phase==='lid'){
    const add=(-dy)/(unit*.60);
    S.lidTarget=clamp(S.lidTarget+add*(S.lidTarget<.12?.72:1),0,1);
  }
});
function endDrag(){
  if(!drag) return; drag=null; S.ribbonVel=0;
  app.style.cursor=S.phase==='inspect'?'grab':'default';
  if(S.phase==='lid'&&S.lidTarget<.14) S.lidTarget=0;
}
addEventListener('pointerup',endDrag);
addEventListener('pointercancel',endDrag);
function releaseRibbon(){
  if(S.phase!=='ribbon') return;
  S.phase='release'; S.fallT=0; drag=null;
  haptic([14,40,22]); thud();
  el.promptLine.textContent='The seal is broken';
  el.prompt.querySelector('.hintbar').style.opacity='0';
}
function beginLidPhase(){
  S.phase='lid'; snapFrom();
  el.prompt.classList.add('vertical');
  el.promptLine.textContent='Lift the lid';
  el.prompt.querySelector('.hintbar').style.opacity='1';
  el.prompt.style.opacity='1';
}
el.skip.addEventListener('click',()=>{
  if(S.phase==='ribbon'){ S.ribbon=1; releaseRibbon(); return; }
  if(S.phase==='lid'){ S.lidTarget=1; return; }
  if(S.phase==='sequence'){ S.seqT=SEQ[S.seqI].dur; }
});
el.replay.addEventListener('click',()=>location.reload());
el.sound.addEventListener('click',()=>{
  soundOn=!soundOn;
  el.sound.textContent=soundOn?'Sound on':'Sound off';
  if(master) master.gain.value=soundOn?.85:0;
});

/* ───────────────────────── frame loop ───────────────────────── */
const clock=new THREE.Clock();
let lidClicked=false, ribbonPromptShown=false;

function frame(){
  const dt=Math.min(clock.getDelta(),.12), t=clock.elapsedTime;
  /* ambient life: a breathing highlight so the black lacquer never reads flat */
  if(S.phase==='ribbon'||S.phase==='release'||S.phase==='pause'){
    key.position.x=.42+Math.sin(t*.22)*.05;
    key.position.z=.52+Math.cos(t*.19)*.04;
  }

  /* ribbon phase — pull-through, slack, then fall */
  if(S.phase==='ribbon'){
    const p=S.ribbon;
    buildTails(.042+p*.30, 1+p*.5);
    const tp=tailPts(.042+p*.30,1+p*.5,.006);
    aiglet.position.set(tp[6][0],tp[6][1]-.004,tp[6][2]);
    aiglet.rotation.z=-.5-p*.5;
    buildBand(smooth(.42,1,p),0,p);
    fastener.rotation.z=-p*.22;
    fastener.position.x=BAND_X+p*.004;
    if(fabricGain&&AC) fabricGain.gain.value=soundOn?Math.min(.035,S.ribbonVel*.012):0;
    setCam('ribbon',easeInOut(sat(t/2.4)));
    if(!ribbonPromptShown&&t>.4){ribbonPromptShown=true;el.prompt.style.opacity='1';}
  } else if(fabricGain) fabricGain.gain.value=0;

  /* release — the band slips off and settles */
  if(S.phase==='release'){
    S.fallT+=dt;
    const u=sat(S.fallT/1.5);
    S.fall=easeIn(u)*.35+easeOut(u)*.65;
    buildBand(1,S.fall,1);
    buildTails(.34*(1-u*.55),1.5);
    const tp=tailPts(.34*(1-u*.55),1.5,.006);
    aiglet.position.set(lerp(tp[6][0],.027,u),lerp(tp[6][1],.004,u),lerp(tp[6][2],.160,u));
    fastener.position.set(lerp(BAND_X+.004,-.043,easeIn(u)),lerp(.051,.006,u*u),lerp(D/2+.010,.181,easeOut(u)));
    fastener.rotation.set(u*1.4,u*.8,-.22-u*.6);
    pullGrp.visible=u<.98;
    if(u>=1){ S.phase='pause'; S.fallT=0; pullGrp.visible=false; }
    setCam('ribbon',1);
  }
  /* pre-opening pause */
  if(S.phase==='pause'){
    S.fallT+=dt;
    if(S.fallT>.55) beginLidPhase();
    setCam('ribbon',1);
  }

  /* lid phase */
  if(S.phase==='lid'){
    S.lidP+=(S.lidTarget-S.lidP)*Math.min(1,dt*7.5);   // mechanical damping
    const p=S.lidP;
    hinge.rotation.x=-Math.pow(p,1.08)*1.80;
    S.fogP=Math.max(S.fogP,smooth(.05,1,p)*.58);
    chamber.intensity=smooth(.18,.62,p)*.085;
    chamber2.intensity=smooth(.34,.85,p)*.05;
    key.intensity=lerp(8.2,9,smooth(0,1,p));
    setCam('lidOpen',easeInOut(smooth(0,.92,p)));
    if(p>.24&&!lidClicked){ el.prompt.style.opacity=String(1-smooth(.25,.6,p)); }
    if(S.lidTarget>=1&&p>.988&&!lidClicked){
      lidClicked=true; click(2400,.05,.045); setTimeout(()=>click(1500,.035,.07),55); haptic(12);
      hinge.rotation.x=-1.80;
      startSequence();
    }
  }

  /* cinematic sequence */
  if(S.phase==='sequence'){
    const ph=SEQ[S.seqI];
    S.seqT+=dt;
    const u=sat(S.seqT/ph.dur);
    ph.fn(u);
    setCam(ph.cam,easeInOut(u));
    if(S.seqT>=ph.dur){
      S.seqI++; S.seqT=0; snapFrom();
      if(S.seqI>=SEQ.length){ enterInspection(); }
      else if(SEQ[S.seqI].enter) SEQ[S.seqI].enter();
    }
  }

  /* cushion rise + watch tilt (shared by sequence and inspection) */
  cushion.position.y=.008+S.rise*.042;
  watch.rotation.x=-S.tilt*.14;
  watch.rotation.z=S.tilt*.03;
  hSec.rotation.y+=dt*.28;

  if(S.phase==='inspect'){
    controls.update();
    camTarget.copy(controls.target);
  }

  updateMist(S.fogP,t,.076+Math.min(1,S.lidP*1.3)*.076,S.lidP);
  renderer.toneMappingExposure=lerp(.62,.50,S.dark);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
window.__vault={S,SEQ,CAM,scene,camera,M,mountWatch,get watch(){return watch;},snapFrom,enterInspection,jump(i){S.phase='sequence';S.seqI=i;S.seqT=0;lidClicked=true;hinge.rotation.x=-1.80;el.prompt.style.opacity='0';el.refs.style.opacity='0';pullGrp.visible=false;bandMesh.visible=false;for(let k=0;k<=i;k++){if(SEQ[k].enter)SEQ[k].enter();if(k<i)SEQ[k].fn(1);}snapFrom();}};
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
frame();
</script>
</body>
</html>
