<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;gap:10px;align-items:baseline;font-family:JetBrains Mono,ui-monospace,monospace">
  <div style="font-size:40px;font-weight:500;letter-spacing:-.02em;color:#E5C08A">{{ hh }}</div>
  <div style="font-size:20px;color:rgba(237,231,218,.3)">:</div>
  <div style="font-size:40px;font-weight:500;letter-spacing:-.02em;color:#E5C08A">{{ mm }}</div>
  <div style="font-size:20px;color:rgba(237,231,218,.3)">:</div>
  <div style="font-size:40px;font-weight:500;letter-spacing:-.02em;color:#E5C08A">{{ ss }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60}}">
class Component extends DCLogic {
  state = { now: Date.now() };
  componentDidMount() {
    this.target = Date.now() + 1000 * (60 * 60 * 9 + 60 * 42 + 18);
    this.t = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const rem = Math.max(0, (this.target || 0) - this.state.now);
    const p = n => String(Math.floor(n)).padStart(2, '0');
    return { hh: p(rem / 3600000), mm: p((rem % 3600000) / 60000), ss: p((rem % 60000) / 1000) };
  }
}
</script>
</body>
</html>
